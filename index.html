<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training OS">
<title>Training OS</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#07071a;color:#e0e0ff;font-family:'JetBrains Mono',monospace;min-height:100vh;font-size:13px;}
input,select,textarea,button{font-family:'JetBrains Mono',monospace;font-size:12px;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
select option{background:#0e0e1f;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#1c1c2e;}
#app{max-width:480px;margin:0 auto;padding-bottom:60px;}
.pad{padding:0 20px;}
.card{background:#0a0a1a;border:1px solid #1c1c2e;border-radius:8px;padding:12px 14px;}
.lbl{font-size:9px;color:#4a4a6a;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:4px;display:block;}
.inp{background:#0e0e1f;border:1px solid #22223a;color:#e0e0ff;padding:8px 10px;border-radius:6px;outline:none;width:100%;}
.sel{background:#0e0e1f;border:1px solid #22223a;color:#e0e0ff;padding:7px 8px;border-radius:5px;outline:none;width:100%;cursor:pointer;}
.btn{padding:10px 14px;border-radius:7px;border:1px solid #3a3a6a;background:#1a1a3a;color:#e0e0ff;cursor:pointer;letter-spacing:0.08em;width:100%;display:block;text-align:center;}
.btn-sm{padding:7px 12px;border-radius:5px;border:1px solid #3a3a6a;background:#1a1a3a;color:#e0e0ff;cursor:pointer;font-size:10px;}
.btn-ok{border-color:#00ff8750;background:#00ff8720;color:#00ff87;}
.btn-danger{border-color:#3a1a1a;background:#1a0a0a;color:#ff6b6b;}
.btn-ghost{border-color:#2a2a4a;background:#1a1a2e;color:#666;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.flex{display:flex;align-items:center;gap:8px;}
.tab-bar{display:flex;margin:16px 20px;background:#0a0a1a;border-radius:8px;padding:3px;border:1px solid #1a1a2e;}
.tab{flex:1;padding:8px 0;background:transparent;border:none;color:#444;border-radius:6px;cursor:pointer;font-size:10px;letter-spacing:0.06em;transition:all 0.2s;}
.tab.active{background:#1a1a3a;color:#e0e0ff;}
.pbar-track{height:4px;background:#1a1a2e;border-radius:2px;overflow:hidden;margin-top:2px;}
.pbar-fill{height:100%;border-radius:2px;transition:width 0.4s;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{width:100%;max-width:480px;background:#0d0d1f;border-radius:16px 16px 0 0;border:1px solid #1c1c2e;border-bottom:none;padding:20px 20px 44px;max-height:90vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:#2a2a4a;border-radius:2px;margin:0 auto 18px;}
.session-row{width:100%;text-align:left;padding:10px 12px;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid #1c1c2e;background:#0a0a1a;}
.badge{font-size:9px;color:#000;padding:2px 5px;border-radius:3px;font-weight:700;min-width:34px;text-align:center;}
.hint{font-size:9px;margin-top:3px;}
.divider{border:none;border-top:1px solid #1a1a2e;margin:16px 0;}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
.ring-lbl{font-size:9px;color:#4a4a6a;letter-spacing:0.14em;text-transform:uppercase;}
.week-btn{padding:4px 9px;border-radius:4px;font-size:11px;border:1px solid #1c1c2e;background:#0e0e1f;color:#444;cursor:pointer;}
.week-btn.active{font-weight:700;}
.coach-box{padding:12px;background:#0a1a0a;border:1px solid #00ff8730;border-radius:8px;}
.section-title{font-size:9px;color:#4a4a6a;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:12px;}
.row-sep{padding:8px 0;border-bottom:1px solid #111;display:flex;align-items:center;gap:10px;}
</style>
</head>
<body>
<div id="app">
  <div id="header" style="padding:20px 20px 0;margin-bottom:16px;"></div>
  <div class="tab-bar" id="tabs"></div>
  <div class="pad" id="content"></div>
</div>

<script>
// ============================================================
// DATA & CONFIG
// ============================================================
const SK = {cfg:'utmb_cfg_v1',log:'utmb_log_v1',edits:'utmb_edits_v2',targets:'utmb_targets_v1',runs:'utmb_runs_v3'};
const WTC = {RECOVERY:'#55efc4',BUILD:'#ffd166',SHARPEN:'#ff9f43',DELOAD:'#74b9ff',RACE:'#fd79a8'};
const TC = {strength:'#7b9cff',intervals:'#ff9f43',easy:'#55efc4',long:'#a29bfe',race:'#fd79a8',rest:'#636e72',walk:'#a0a0a0',sauna:'#ff9f43',other:'#636e72'};
const TL = {strength:'STR',intervals:'INT',easy:'EASY',long:'LONG',race:'RACE',rest:'REST',walk:'WALK',sauna:'SAUNA',other:'OTHER'};
const WEEK_TYPES = ['RECOVERY','BUILD','SHARPEN','DELOAD','RACE'];
// Types that count toward daily/weekly totals by default
const ALL_TYPES = ['strength','intervals','easy','long','race','rest','walk','sauna','other'];
const DEFAULT_COUNT_TYPES = ['strength','intervals','easy','long','race'];

const DEF_CFG = {hrvLow:45,hrvHigh:70,rhrLow:45,rhrHigh:50,raceDateStr:'2026-08-28',blockStartStr:'2026-06-06',raceName:'UTMB 2026',countTypes:DEFAULT_COUNT_TYPES};

// BASE_PLAN: empty day slots. Sessions only populate from TP iCal import or manual edits.
const DAYS_OF_WEEK=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function makeEmptyWeek(wNum){
  return {week:wNum,days:DAYS_OF_WEEK.map(day=>({day,label:'',type:'easy',detail:'',km:0,vert:0,hrs:0}))};
}
const BASE_PLAN=Array.from({length:12},(_,i)=>makeEmptyWeek(i+1));
const DEF_TARGETS = [
  {week:1,type:'RECOVERY',km:75,vert:2750,hrs:10},
  {week:2,type:'RECOVERY',km:75,vert:2750,hrs:10},
  {week:3,type:'BUILD',km:92,vert:3500,hrs:12},
  {week:4,type:'BUILD',km:97,vert:3800,hrs:13},
  {week:5,type:'BUILD',km:97,vert:4000,hrs:13},
  {week:6,type:'BUILD',km:102,vert:4500,hrs:14},
  {week:7,type:'BUILD',km:102,vert:5000,hrs:15},
  {week:8,type:'SHARPEN',km:107,vert:5500,hrs:16},
  {week:9,type:'SHARPEN',km:110,vert:5800,hrs:16},
  {week:10,type:'RACE',km:110,vert:6000,hrs:16},
  {week:11,type:'DELOAD',km:80,vert:3000,hrs:11},
  {week:12,type:'DELOAD',km:45,vert:1200,hrs:6},
];

// ============================================================
// STORAGE
// ============================================================
const S = {
  get(k,fb){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):fb;}catch{return fb;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};

// ============================================================
// STATE
// ============================================================
let CFG = S.get(SK.cfg, DEF_CFG);
let LOG = S.get(SK.log, {});
let EDITS = S.get(SK.edits, {});
let TARGETS = S.get(SK.targets, null) || buildTargets();
let RUNS = S.get(SK.runs, {});
let ACTIVE_TAB = 'today';
let EXPANDED_DAY = null;
let EDITING_DAY = null;
let EDIT_WEEK = null;
let BLOCK_EDITING = null;

function save(key, val){ S.set(key,val); }

// ============================================================
// HELPERS
// ============================================================
// Always use local date string to avoid UTC timezone shift (critical for AEST +10)
function localDateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const dy=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dy;
}
function today(){ return localDateStr(new Date()); }

// Find the Monday on or before a given date — this is the true week anchor
function getBlockMonday(){
  const bs=new Date(CFG.blockStartStr+'T00:00:00');
  bs.setHours(0,0,0,0);
  const dow=bs.getDay(); // 0=Sun,1=Mon,...,6=Sat
  const daysBack=dow===0?6:dow-1; // days to go back to reach Monday
  bs.setDate(bs.getDate()-daysBack);
  return bs;
}

function totalWeeks(){
  const mon=getBlockMonday();
  const rd=new Date(CFG.raceDateStr+'T00:00:00');
  return Math.max(1,Math.ceil((rd-mon)/(7*86400000)));
}

function curWeek(){
  const mon=getBlockMonday();
  const now=new Date(); now.setHours(0,0,0,0);
  const w=Math.floor((now-mon)/(7*86400000))+1;
  return Math.max(1,Math.min(totalWeeks(),w));
}

// Returns {mon, sun} Date objects for a given week index (0-based)
function weekDates(wIdx){
  const anchor=getBlockMonday();
  const mon=new Date(anchor);
  mon.setDate(anchor.getDate()+wIdx*7);
  const sun=new Date(mon);
  sun.setDate(mon.getDate()+6);
  return {mon,sun};
}

// Format a Date as "6 Jun" or "28 Aug"
function fmtDate(d){
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate()+' '+months[d.getMonth()];
}

// Format today's date as "Mon 7 Jun 2026"
function fmtToday(){
  const d=new Date();
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}

// Get the actual calendar date string (YYYY-MM-DD) for a plan slot — uses local time
function slotDate(wIdx, dayName){
  const {mon}=weekDates(wIdx);
  const targetDow={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[dayName]??0;
  const d=new Date(mon);
  d.setDate(mon.getDate()+targetDow);
  return localDateStr(d);
}
// Same but returns a Date object (for fmtDate display)
function slotDateObj(wIdx, dayName){
  const {mon}=weekDates(wIdx);
  const targetDow={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[dayName]??0;
  const d=new Date(mon);
  d.setDate(mon.getDate()+targetDow);
  return d;
}

function daysToRace(){
  const rd=new Date(CFG.raceDateStr+'T00:00:00');
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.max(0,Math.ceil((rd-now)/86400000));
}

function getPlan(){
  const tw=totalWeeks();
  const out=[];
  for(let i=0;i<tw;i++){
    out.push(BASE_PLAN[i]||{...BASE_PLAN[6],week:i+1});
  }
  return out;
}

function buildTargets(){
  const tw=totalWeeks();
  const out=[];
  for(let i=0;i<tw;i++){
    out.push(DEF_TARGETS[i]||{week:i+1,type:'BUILD',km:100,vert:4500,hrs:14});
  }
  return out;
}

function getSession(wIdx,dIdx){
  const plan=getPlan();
  const base=plan[wIdx]&&plan[wIdx].days[dIdx];
  if(!base) return null;
  return Object.assign({},base,EDITS['w'+wIdx+'-d'+dIdx]||{});
}
// Returns array of activities for a day (always an array, never null)
function getDayActivities(wIdx,dIdx){
  const v=RUNS['w'+wIdx+'-d'+dIdx];
  if(!v) return [];
  // Migrate legacy single-object format to array
  if(!Array.isArray(v)) return [v];
  return v;
}
// Save activities array for a day
function saveDayActivities(wIdx,dIdx,activities){
  RUNS['w'+wIdx+'-d'+dIdx]=activities;
  S.set(SK.runs,RUNS);
}
// Compat shim — returns first completed activity (for fatigue/RPE lookups)
function getRunLog(wIdx,dIdx){
  const acts=getDayActivities(wIdx,dIdx);
  return acts.find(a=>a.completed)||acts[0]||null;
}
// Sum km/vert/hrs across activities whose type is in CFG.countTypes
function getDayTotals(wIdx,dIdx){
  const countTypes=CFG.countTypes||DEFAULT_COUNT_TYPES;
  return getDayActivities(wIdx,dIdx)
    .filter(a=>a.completed && countTypes.includes(a.type||'easy'))
    .reduce((acc,a)=>{
      acc.km+=parseFloat(a.actualKm||0);
      acc.vert+=parseFloat(a.actualVert||0);
      acc.hrs+=parseFloat(a.actualHrs||0);
      return acc;
    },{km:0,vert:0,hrs:0});
}
// Is any activity on this day completed?
function isDayDone(wIdx,dIdx){
  return getDayActivities(wIdx,dIdx).some(a=>a.completed);
}
// Generate a unique id for a new activity
function newActId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function dowIndex(day){ return {Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:0}[day]??-1; }

function scoreHRV(v){
  const n=parseFloat(v); if(isNaN(n)) return null;
  const lo=CFG.hrvLow, hi=CFG.hrvHigh;
  if(n>=lo&&n<=hi) return 60+((n-lo)/(hi-lo))*20;
  if(n>hi) return Math.min(100,80+((n-hi)/10)*20);
  return Math.max(0,40-((lo-n)/15)*40);
}
function scoreRHR(v){
  const n=parseFloat(v); if(isNaN(n)) return null;
  const lo=CFG.rhrLow, hi=CFG.rhrHigh;
  if(n<=lo) return 90;
  if(n<=hi) return 70-((n-lo)/(hi-lo))*20;
  return Math.max(0,50-((n-hi)/10)*30);
}
function scoreSleep(v){ return !v?null:v==='great'?90:v==='ok'?60:25; }
function scoreSub(legs,mood,mot){
  const vals=[legs,mood,mot].filter(x=>x!=='').map(Number);
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length/5*100);
}
// 7-day weighted fatigue load — more recent days weighted more heavily
// RPE/perf scores cast a recovery shadow that decays over days
function getFatigueLoad(){
  const weights=[1.0,0.85,0.7,0.55,0.4,0.28,0.15]; // today-1 to today-7
  let totalLoad=0, totalWeight=0;
  const plan=getPlan();
  for(let daysAgo=1;daysAgo<=7;daysAgo++){
    const d=new Date(); d.setDate(d.getDate()-daysAgo); d.setHours(0,0,0,0);
    const dateStr=localDateStr(d);
    const w=weights[daysAgo-1];
    // Check daily log RPE first
    const logEntry=LOG[dateStr];
    if(logEntry?.rpe){
      const rpeVal=parseInt(logEntry.rpe);
      totalLoad+=rpeVal*w; totalWeight+=w;
      continue;
    }
    // Fall back to run log perf for that date
    const diffDays=Math.floor((d-getBlockMonday())/(86400000));    if(diffDays>=0){
      const wIdx=Math.floor(diffDays/7);
      const dow=d.getDay();
      if(plan[wIdx]){
        const dIdx=plan[wIdx].days.findIndex(s=>dowIndex(s.day)===dow);
        if(dIdx>=0){
          const rl=getRunLog(wIdx,dIdx);
          if(rl?.perf){ totalLoad+=parseInt(rl.perf)*w; totalWeight+=w; }
        }
      }
    }
  }
  if(!totalWeight) return null;
  return totalLoad/totalWeight; // 1-5 scale
}

function getDecision(combined, fatigueLoad){
  // Fatigue penalty: each point above 3 on the weighted load subtracts from combined score
  // A week of hard 4s = ~-8 pts; a race week = ~-15 pts
  let adj=combined;
  if(fatigueLoad!=null){
    const fatiguePenalty=Math.round((fatigueLoad-2.5)*8);
    adj=Math.max(0, adj-Math.max(0,fatiguePenalty));
  }
  if(adj>=74) return {label:'GO HARD',short:'up',color:'#00ff87',desc:'All signals green. Execute as planned or push harder.'};
  if(adj>=55) return {label:'AS PLANNED',short:'right',color:'#b8ff4f',desc:'Solid baseline. Stick to the plan.'};
  if(adj>=38) return {label:'MODIFY',short:'wave',color:'#ffd166',desc:'Mixed signals. Cut intensity or volume ~20%.'};
  return {label:'BACK OFF',short:'down',color:'#ff6b6b',desc:'Non-negotiable. Easy movement or full rest only.'};
}

// ============================================================
// ICAL PARSER
// ============================================================
function parseICS(text){
  const events=[];
  const blocks=text.split('BEGIN:VEVENT');
  for(let i=1;i<blocks.length;i++){
    const block=blocks[i];
    const get=key=>{
      const re=new RegExp(key+'[^:]*:([^\r\n]+)');
      const m=block.match(re);
      return m?m[1].trim():null;
    };
    const dtstart=get('DTSTART');
    const summary=get('SUMMARY');
    const description=get('DESCRIPTION')||'';
    if(!dtstart||!summary) continue;
    // Strip everything after T to get just YYYYMMDD regardless of format
    const ds=dtstart.replace(/[^0-9]/g,'').slice(0,8);
    if(ds.length<8) continue;
    const year=parseInt(ds.slice(0,4));
    const month=parseInt(ds.slice(4,6))-1;
    const day=parseInt(ds.slice(6,8));
    // Use local date constructor to avoid UTC offset shifting the day
    const date=new Date(year,month,day,12,0,0);
    const dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    events.push({
      date,
      dateStr,
      summary:summary.replace(/\\n/g,' ').replace(/\\,/g,',').trim(),
      description:description.replace(/\\n/g,' ').replace(/\\,/g,',').trim(),
    });
  }
  return events.sort((a,b)=>a.date-b.date);
}
function guessTypeFromSummary(s){
  const t=s.toLowerCase();
  if(t.includes('race')||t.includes('utmb')||t.includes('utk')) return 'race';
  if(t.includes('rest')||t.includes('off')||t.includes('travel')) return 'rest';
  if(t.includes('long')||t.includes('climb')||t.includes('vert')) return 'long';
  if(t.includes('interval')||t.includes('sprint')||t.includes('rep')||t.includes('threshold')||t.includes('vo2')||t.includes('tempo')) return 'intervals';
  if(t.includes('strength')||t.includes('gym')||t.includes('squat')||t.includes('upper')||t.includes('lower')||t.includes('weights')) return 'strength';
  return 'easy';
}
function parseTPDescription(desc){
  // Unescape literal \n sequences from iCal
  const d = desc.replace(/\\n/g,'\n').replace(/\\,/g,',');
  const result = {};

  // Planned Time: H:MM or HH:MM
  const pt = d.match(/Planned Time:\s*(\d+):(\d+)/);
  if(pt) result.hrs = Math.round((parseInt(pt[1]) + parseInt(pt[2])/60) * 100) / 100;

  // Distance Planned: X km
  const dp = d.match(/Distance Planned:\s*([\d.]+)\s*km/i);
  if(dp) result.km = parseFloat(dp[1]);

  // Workout type (used for type inference)
  const wt = d.match(/Workout type:\s*([^\n]+)/);
  if(wt) result.workoutType = wt[1].trim();

  return result;
}
function applyICSToEdits(icsText){
  const events=parseICS(icsText);
  if(!events.length) return {ok:false,msg:'No events found in calendar data.'};
  const plan=getPlan();

  // Build date lookup using Monday-anchored slotDate() - returns local date string
  const dateLookup={};
  plan.forEach((wk,wIdx)=>{
    wk.days.forEach((d,dIdx)=>{
      const dateStr=slotDate(wIdx,d.day);
      dateLookup[dateStr]={wIdx,dIdx};
    });
  });

  // Group events by date to handle multiple sessions on same day
  const byDate={};
  events.forEach(ev=>{
    if(!byDate[ev.dateStr]) byDate[ev.dateStr]=[];
    byDate[ev.dateStr].push(ev);
  });

  let matched=0, skipped=0;
  const newEdits={...EDITS};
  Object.entries(byDate).forEach(([dateStr,evs])=>{
    const slot=dateLookup[dateStr];
    if(!slot){skipped+=evs.length;return;}
    const {wIdx,dIdx}=slot;
    const base=plan[wIdx].days[dIdx];
    // Filter out non-training entries like sauna, walks, rest days
    const skip=['sauna','walk','walking','rest','day off','other'];
    const training=evs.filter(e=>!skip.some(s=>e.summary.toLowerCase().includes(s)));
    const use=training.length?training:evs;
    const label=use.map(e=>e.summary).join(' + ');
    const rawDetail=use.map(e=>e.description).filter(Boolean).join(' | ')||base.detail;
    const type=guessTypeFromSummary(use[0].summary);

    // Parse planned metrics from TP description fields
    let km=base.km, hrs=base.hrs;
    let totalKm=0, totalHrs=0, hasKm=false, hasHrs=false;
    use.forEach(e=>{
      const m=parseTPDescription(e.description||'');
      if(m.km!=null){ totalKm+=m.km; hasKm=true; }
      if(m.hrs!=null){ totalHrs+=m.hrs; hasHrs=true; }
    });
    if(hasKm) km=Math.round(totalKm*10)/10;
    if(hasHrs) hrs=Math.round(totalHrs*100)/100;

    // Auto-upgrade to long if km > 15
    const finalType = km>15 && type==='easy' ? 'long' : type;

    newEdits['w'+wIdx+'-d'+dIdx]={label, type:finalType, detail:rawDetail, km, vert:base.vert, hrs};
    matched++;
  });
  EDITS=newEdits; S.set(SK.edits,EDITS);
  const msg=matched+' days matched to plan.'+(skipped?' '+skipped+' events outside block range.':'');
  return {ok:true,msg};
}

// ============================================================
// AI
// ============================================================
async function aiCall(system, userMsg){
  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system,messages:[{role:'user',content:userMsg}]})
  });
  const d = await r.json();
  return d.content?.find(b=>b.type==='text')?.text || 'No response.';
}

// ============================================================
// DOM HELPERS
// ============================================================
function el(tag,attrs,children){
  const e = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(k=>{
    if(k==='style'&&typeof attrs[k]==='object'){ Object.assign(e.style,attrs[k]); }
    else if(k==='class'){ e.className=attrs[k]; }
    else if(k.startsWith('on')){ e.addEventListener(k.slice(2).toLowerCase(),attrs[k]); }
    else { e.setAttribute(k,attrs[k]); }
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null||c===false) return;
      e.appendChild(typeof c==='string'?document.createTextNode(c):c);
    });
  }
  return e;
}

function sel(attrs,opts,val){

function ring(value,color,label,size=76){
  const r=size/2-7, circ=2*Math.PI*r;
  const pct=value!=null?Math.max(0,Math.min(100,value))/100:0;
  const fill=pct*circ;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',size); svg.setAttribute('height',size);
  const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
  bg.setAttribute('cx',size/2); bg.setAttribute('cy',size/2); bg.setAttribute('r',r);
  bg.setAttribute('fill','none'); bg.setAttribute('stroke','#1c1c2e'); bg.setAttribute('stroke-width','5.5');
  svg.appendChild(bg);
  if(value!=null){
    const arc=document.createElementNS('http://www.w3.org/2000/svg','circle');
    arc.setAttribute('cx',size/2); arc.setAttribute('cy',size/2); arc.setAttribute('r',r);
    arc.setAttribute('fill','none'); arc.setAttribute('stroke',color); arc.setAttribute('stroke-width','5.5');
    arc.setAttribute('stroke-dasharray',fill+' '+circ); arc.setAttribute('stroke-linecap','round');
    arc.setAttribute('transform','rotate(-90 '+(size/2)+' '+(size/2)+')');
    arc.style.transition='stroke-dasharray 0.5s ease';
    svg.appendChild(arc);
  }
  const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
  txt.setAttribute('x',size/2); txt.setAttribute('y',size/2+5); txt.setAttribute('text-anchor','middle');
  txt.setAttribute('fill',value!=null?color:'#333'); txt.setAttribute('font-size',value!=null?15:10);
  txt.setAttribute('font-family',"'JetBrains Mono',monospace"); txt.setAttribute('font-weight','700');
  txt.textContent=value!=null?Math.round(value):'--';
  svg.appendChild(txt);
  const wrap=div({class:'ring-wrap'});
  wrap.appendChild(svg);
  wrap.appendChild(span({class:'ring-lbl'},label));
  return wrap;
}

function numInp(labelText,val,cb,unit,hint,hintColor){
  const i=inp({type:'number',class:'inp',value:val||'',placeholder:''});

// Activity type key (used in legend and import validation)
const TYPE_KEY = {
  strength: 'Gym / weights / strength',
  intervals: 'Speed / intervals / threshold / hill reps',
  easy:      'Easy run / recovery / Z2',
  long:      'Long run (auto-set if km > 15)',
  race:      'Race or time trial',
  rest:      'Rest / travel / off day',
  walk:      'Walk',
  sauna:     'Sauna / heat session',
  other:     'Other / cross training',
};

function planToCSV(){
  const plan=getPlan();

  // Legend block at top so blank-plan users understand the format
  const legend=[
    '# TRAINING OS - PLAN EXPORT',
    '# Generated: '+new Date().toLocaleString(),
    '# Race: '+CFG.raceName+' ('+CFG.raceDateStr+')',
    '# Block start (Monday): '+localDateStr(getBlockMonday()),
    '#',
    '# HOW TO USE:',
    '# - Edit session rows below in Numbers / Excel / Google Sheets',
    '# - Keep the header row (week,date,day,...) intact',
    '# - Leave blank rows as-is for rest days, or fill them in',
    '# - Import back via Settings > Plan Export / Import',
    '#',
    '# ACTIVITY TYPES (use exactly as shown in the "type" column):',
    ...Object.entries(TYPE_KEY).map(([k,v])=>'#   '+k.padEnd(12)+' = '+v),
    '#',
    '# WEEK TYPES: RECOVERY | BUILD | SHARPEN | DELOAD | RACE',
    '#',
  ];

  // Column header
  const header='week,date,day,week_type,session_name,type,km,vert_m,hrs,notes';

  const rows=[];
  plan.forEach((wk,wIdx)=>{
    const t=TARGETS[wIdx]||{};
    wk.days.forEach((d,dIdx)=>{
      const s=getSession(wIdx,dIdx)||d;
      const dateStr=slotDate(wIdx,d.day);
      const hasContent=s.label&&s.label.trim()!=='';
      rows.push([
        wIdx+1,
        dateStr,
        d.day,
        t.type||'BUILD',
        '"'+(s.label||'').replace(/"/g,"'")+'"',
        hasContent?s.type:'',
        hasContent?(s.km||0):'',
        hasContent?(s.vert||0):'',
        hasContent?(s.hrs||0):'',
        '"'+(s.detail||'').replace(/"/g,"'")+'"',
      ].join(','));
    });
    // Blank separator row between weeks
    rows.push('');
  });

  return [...legend, header, ...rows].join('\n');
}

function csvToEdits(csv){
  const plan=getPlan();
  // Strip comment lines and blanks
  const lines=csv.split('\n').filter(l=>l.trim()&&!l.trim().startsWith('#'));
  if(!lines.length) return {};

  // Find header row
  const headerIdx=lines.findIndex(l=>l.toLowerCase().includes('week')&&l.toLowerCase().includes('date')&&l.toLowerCase().includes('day'));
  const startIdx=headerIdx>=0?headerIdx+1:1;

  const edits={};
  let importedCount=0;

  for(let i=startIdx;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line) continue;

    // Parse CSV respecting quoted fields
    const cols=[];
    let cur='', inQ=false;
    for(let c=0;c<line.length;c++){
      const ch=line[c];
      if(ch==='"'){ inQ=!inQ; }
      else if(ch===','&&!inQ){ cols.push(cur.trim()); cur=''; }
      else { cur+=ch; }
    }
    cols.push(cur.trim());

    if(cols.length<3) continue;

    // Support both old format (week,day,...) and new (week,date,day,...)
    let wk, dateStr, dayName, weekType, label, type, km, vert, hrs, detail;

    const hasDate=cols[1]&&cols[1].match(/^\d{4}-\d{2}-\d{2}$/);
    if(hasDate){
      // New format: week,date,day,week_type,session_name,type,km,vert_m,hrs,notes
      wk=parseInt(cols[0]);
      dateStr=cols[1];
      dayName=cols[2];
      weekType=(cols[3]||'').toUpperCase();
      label=(cols[4]||'').replace(/^"|"$/g,'').trim();
      type=(cols[5]||'easy').trim().toLowerCase()||'easy';
      km=parseFloat(cols[6])||0;
      vert=parseFloat(cols[7])||0;
      hrs=parseFloat(cols[8])||0;
      detail=(cols[9]||'').replace(/^"|"$/g,'').trim();
    } else {
      // Old format: week,day,label,type,km,vert,hrs,detail
      wk=parseInt(cols[0]);
      dayName=cols[1];
      label=(cols[2]||'').replace(/^"|"$/g,'').trim();
      type=(cols[3]||'easy').trim().toLowerCase()||'easy';
      km=parseFloat(cols[4])||0;
      vert=parseFloat(cols[5])||0;
      hrs=parseFloat(cols[6])||0;
      detail=(cols[7]||'').replace(/^"|"$/g,'').trim();
    }

    if(!label) continue; // skip empty sessions

    // Auto-upgrade type to long if km > 15
    if(km>15&&type==='easy') type='long';

    // Validate type
    if(!TYPE_KEY[type]) type='easy';

    const wIdx=wk-1;
    if(!plan[wIdx]) continue;

    // Match by date string first (most accurate), fall back to day name
    let dIdx=-1;
    if(dateStr){
      dIdx=plan[wIdx].days.findIndex((_,di)=>slotDate(wIdx,plan[wIdx].days[di].day)===dateStr);
    }
    if(dIdx<0) dIdx=plan[wIdx].days.findIndex(d=>d.day===dayName);
    if(dIdx<0) continue;

    // Apply week type to TARGETS if present
    if(weekType&&WEEK_TYPES.includes(weekType)&&TARGETS[wIdx]){
      TARGETS[wIdx]={...TARGETS[wIdx],type:weekType};
    }

    edits['w'+wIdx+'-d'+dIdx]={label,type,detail,km,vert,hrs};
    importedCount++;
  }

  // Save updated targets if week types were in the CSV
  S.set(SK.targets,TARGETS);
  return {edits,importedCount};
}

function download(content,filename,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=filename; a.click();
}
function exportAll(){
  const bundle={version:2,exportedAt:new Date().toISOString(),CFG,LOG,EDITS,TARGETS,RUNS};
  download(JSON.stringify(bundle,null,2),'training-os-backup.json','application/json');
}
function importAll(json){
  try{
    const b=JSON.parse(json);
    if(!b.version) throw new Error('Invalid file');
    if(b.CFG){CFG=b.CFG;S.set(SK.cfg,CFG);}
    if(b.LOG){LOG=b.LOG;S.set(SK.log,LOG);}
    if(b.EDITS){EDITS=b.EDITS;S.set(SK.edits,EDITS);}
    if(b.TARGETS){TARGETS=b.TARGETS;S.set(SK.targets,TARGETS);}
    if(b.RUNS){RUNS=b.RUNS;S.set(SK.runs,RUNS);}
    return 'Data restored. Reloading...';
  }catch(e){ return 'Import failed: '+e.message; }
}

function renderToday(){
  const wrap=div({});
  const td=today();
  const saved=LOG[td]||{};
  const wIdx=curWeek()-1;
  const dow=new Date().getDay();
  const plan=getPlan();
  const dIdx=plan[wIdx]?.days.findIndex(d=>dowIndex(d.day)===dow)??-1;
  const todaySess=dIdx>=0?getSession(wIdx,dIdx):null;
  const todayRun=dIdx>=0?getRunLog(wIdx,dIdx):null;

  // State held in closure vars updated by inputs
  let hrv=saved.hrv||'', rhr=saved.rhr||'', sleep=saved.sleep||'';
  let legs=saved.legs||'', mood=saved.mood||'', mot=saved.motivation||'', rpe=saved.rpe||'';
  let note=saved.note||'';

  function computeScores(){
    const h=scoreHRV(hrv), r=scoreRHR(rhr), s=scoreSleep(sleep);
    const physVals=[h,r,s].filter(x=>x!=null);
    const rScore=physVals.length?Math.round(physVals.reduce((a,b)=>a+b,0)/physVals.length):null;
    const sScore=scoreSub(legs,mood,mot);
    const combined=rScore!=null&&sScore!=null?Math.round((rScore+sScore)/2):(rScore??sScore);
    const fatigueLoad=getFatigueLoad();
    return {rScore,sScore,combined,fatigueLoad};
  }

  // Decision banner
  const decBanner=div({style:{padding:'14px 16px',marginBottom:'20px',borderRadius:'8px',border:'1px solid #1c1c2e',background:'#0a0a1a'}});
  decBanner.id='dec-banner';

  // Rings row
  const ringsRow=div({style:{display:'flex',justifyContent:'space-around',padding:'16px 0',marginBottom:'20px',borderTop:'1px solid #1a1a2e',borderBottom:'1px solid #1a1a2e'}});
  ringsRow.id='rings-row';

  function updateDecision(){
    const {rScore,sScore,combined,fatigueLoad}=computeScores();
    const dec=combined!=null?getDecision(combined,fatigueLoad):null;

    // Update banner
    decBanner.innerHTML='';
    if(dec){
      decBanner.style.background=dec.color+'12';
      decBanner.style.border='1px solid '+dec.color+'35';
      decBanner.style.borderLeft='3px solid '+dec.color;
      decBanner.appendChild(span({style:{fontSize:'20px',fontFamily:"'Bebas Neue',cursive",letterSpacing:'0.1em',color:dec.color,display:'block'}},dec.label));
      decBanner.appendChild(span({style:{fontSize:'11px',color:'#888',marginTop:'4px',lineHeight:'1.6',display:'block'}},dec.desc));
      if(fatigueLoad!=null){
        const fl=fatigueLoad.toFixed(1);
        const flColor=fatigueLoad>3.5?'#ffd166':fatigueLoad>4.2?'#ff6b6b':'#555';
        decBanner.appendChild(span({style:{fontSize:'9px',color:flColor,display:'block',marginTop:'6px',letterSpacing:'0.1em'}},'7-DAY FATIGUE LOAD: '+fl+'/5'));
      }
    } else {
      decBanner.style.background='#0a0a1a';
      decBanner.style.border='1px solid #1c1c2e';
      decBanner.style.borderLeft='1px solid #1c1c2e';
      decBanner.appendChild(span({style:{fontSize:'12px',color:'#333'}},'Enter readings to get today\'s decision'));
    }

    // Update rings
    ringsRow.innerHTML='';
    ringsRow.appendChild(ring(rScore,'#60a5fa','Physical'));
    ringsRow.appendChild(ring(sScore,'#c084fc','Subjective'));
    ringsRow.appendChild(ring(combined,dec?.color||'#333','Combined',84));
  }

  wrap.appendChild(decBanner);
  wrap.appendChild(ringsRow);
  updateDecision();

  // Today's session card
  if(todaySess){
    const tc=TC[todaySess.type]||'#555';
    const sessCard=div({style:{padding:'12px 14px',marginBottom:'20px',background:'#0b0b1c',border:'1px solid '+tc+'30',borderRadius:'8px'}});
    const hdrRow=div({class:'flex',style:{marginBottom:'6px'}});
    hdrRow.appendChild(span({style:{fontSize:'9px',background:tc,color:'#000',padding:'2px 6px',borderRadius:'3px',fontWeight:'700'}},TL[todaySess.type]||'--'));
    hdrRow.appendChild(span({style:{fontSize:'9px',color:'#4a4a6a',letterSpacing:'0.1em'}},'TODAY - WK '+(wIdx+1)));
    if(todayRun?.completed) hdrRow.appendChild(span({style:{fontSize:'9px',color:'#00ff87',marginLeft:'auto'}},'DONE'));
    sessCard.appendChild(hdrRow);
    sessCard.appendChild(div({style:{fontSize:'14px',color:'#e0e0ff',marginBottom:'4px'}},todaySess.label));
    sessCard.appendChild(div({style:{fontSize:'11px',color:'#666',lineHeight:'1.6',marginBottom:'8px'}},todaySess.detail));
    sessCard.appendChild(div({style:{display:'flex',gap:'14px',marginBottom:'10px'}},[
      span({style:{fontSize:'10px',color:'#555'}},todaySess.km+'km'),
      span({style:{fontSize:'10px',color:'#555'}},todaySess.vert+'m'),
      span({style:{fontSize:'10px',color:'#555'}},todaySess.hrs+'hr'),
    ]));
    const logBtn=btn({class:'btn-sm'+(todayRun?.completed?' btn-ok':''),onclick:()=>showRunModal(wIdx,dIdx,todaySess,todayRun)},todayRun?.completed?'Edit log':'Log this session');
    sessCard.appendChild(logBtn);
    wrap.appendChild(sessCard);
  }

  // Pre-populate RPE from yesterday's logged session if not already saved today
  if(!saved.rpe){
    const yd=new Date(); yd.setDate(yd.getDate()-1);
    const ydStr=localDateStr(yd);
    // Check yesterday's daily log first
    if(LOG[ydStr]?.rpe) rpe=LOG[ydStr].rpe;
    else {
      // Fall back to yesterday's run log perf rating as a proxy
      const ydDow=yd.getDay();
      const ydPlan=getPlan();
      const ydWIdx=Math.max(0,Math.floor((yd-getBlockMonday())/(7*86400000)));
      if(ydPlan[ydWIdx]){
        const ydDIdx=ydPlan[ydWIdx].days.findIndex(d=>dowIndex(d.day)===ydDow);
        if(ydDIdx>=0){
          const ydRun=getRunLog(ydWIdx,ydDIdx);
          if(ydRun?.perf) rpe=ydRun.perf;
        }
      }
    }
  }

  // HRV / RHR inputs
  const grid1=div({class:'grid2',style:{marginBottom:'12px'}});
  const hrvN=parseFloat(hrv);
  const hrvHint=!isNaN(hrvN)?(hrvN<CFG.hrvLow?{t:'Below range',c:'#ff6b6b'}:hrvN>CFG.hrvHigh?{t:'Above range',c:'#b8ff4f'}:{t:'In range',c:'#00ff87'}):null;
  const rhrN=parseFloat(rhr);
  const rhrHint=!isNaN(rhrN)?(rhrN<CFG.rhrLow?{t:'Below baseline',c:'#b8ff4f'}:rhrN>CFG.rhrHigh?{t:'Elevated',c:'#ff6b6b'}:{t:'Baseline',c:'#00ff87'}):null;

  const hrvF=numInp('HRV',hrv,v=>{hrv=v;updateDecision();},'ms',hrvHint?.t,hrvHint?.c);
  const rhrF=numInp('Resting HR',rhr,v=>{rhr=v;updateDecision();},'bpm',rhrHint?.t,rhrHint?.c);
  grid1.appendChild(hrvF); grid1.appendChild(rhrF);
  wrap.appendChild(grid1);

  const grid2=div({class:'grid2',style:{marginBottom:'12px'}});
  grid2.appendChild(selField('Sleep',sleep,[{v:'great',l:'Solid 8+'},{v:'ok',l:'6-7hr OK'},{v:'poor',l:'Poor / broken'}],v=>{sleep=v;updateDecision();}));
  grid2.appendChild(selField('Yesterday RPE',rpe,[{v:'1',l:'1-2 Very easy'},{v:'3',l:'3 Moderate'},{v:'4',l:'4 Hard'},{v:'5',l:'5 Maximal'}],v=>{rpe=v;updateDecision();}));
  grid2.appendChild(selField('Legs',legs,[{v:'5',l:'5 Fresh'},{v:'4',l:'4 Good'},{v:'3',l:'3 OK'},{v:'2',l:'2 Heavy'},{v:'1',l:'1 Wrecked'}],v=>{legs=v;updateDecision();}));
  grid2.appendChild(selField('Mood',mood,[{v:'5',l:'5 Sharp'},{v:'4',l:'4 Good'},{v:'3',l:'3 OK'},{v:'2',l:'2 Stressed'},{v:'1',l:'1 Flat'}],v=>{mood=v;updateDecision();}));
  wrap.appendChild(grid2);

  wrap.appendChild(div({style:{marginBottom:'16px'}},[selField('Motivation',mot,[{v:'5',l:'5 Hungry'},{v:'4',l:'4 Ready'},{v:'3',l:'3 OK'},{v:'2',l:'2 Meh'},{v:'1',l:'1 None'}],v=>{mot=v;updateDecision();})]));

  const noteWrap=div({style:{marginBottom:'16px'}});
  noteWrap.appendChild(lbl('Session note'));
  const ta=el('textarea',{class:'inp',rows:'2',placeholder:'Anything worth logging...'},note);
  ta.addEventListener('input',()=>{note=ta.value;});
  noteWrap.appendChild(ta);
  wrap.appendChild(noteWrap);

  const saveBtn=btn({class:'btn',onclick:()=>{
    const {rScore,sScore,combined,fatigueLoad}=computeScores();
    const dec=combined!=null?getDecision(combined,fatigueLoad):null;
    const entry={hrv,rhr,sleep,legs,mood,motivation:mot,rpe,note,decision:dec?.label,fatigueLoad,ts:Date.now()};
    LOG[td]=entry; S.set(SK.log,LOG);
    saveBtn.textContent='LOGGED'; saveBtn.style.color='#00ff87'; saveBtn.style.borderColor='#00ff87';
    setTimeout(()=>{saveBtn.textContent='LOG TODAY';saveBtn.style.color='';saveBtn.style.borderColor='';},1800);
  }},'LOG TODAY');
  wrap.appendChild(saveBtn);

  return wrap;
}

function showActivityModal(wIdx, dIdx, aIdx, planSession){
  const activities=getDayActivities(wIdx,dIdx);

  let label=existing.label||planSession?.label||'';
  let type=existing.type||planSession?.type||'easy';
  let akm=existing.actualKm||'';
  let avert=existing.actualVert||'';
  let ahrs=existing.actualHrs||'';
  let perf=existing.perf||'';
  let exec=existing.exec||'';
  let note=existing.note||'';

  const typeDiv=div({style:{marginBottom:'14px'}});
  typeDiv.appendChild(lbl('Type'));
  const typeBtns=div({style:{display:'flex',gap:'5px',flexWrap:'wrap'}});
  const typeBtnEls={};
  ALL_TYPES.forEach(t=>{
    const b=btn({style:{padding:'5px 8px',borderRadius:'4px',fontSize:'9px',
      background:type===t?TC[t]+'30':'#0a0a18',border:'1px solid '+(type===t?TC[t]:'#2a2a4a'),color:type===t?TC[t]:'#555'},
      onclick:()=>{
        type=t;
        ALL_TYPES.forEach(tt=>{
          const bb=typeBtnEls[tt];
          if(bb){ bb.style.background=tt===t?TC[tt]+'30':'#0a0a18'; bb.style.borderColor=tt===t?TC[tt]:'#2a2a4a'; bb.style.color=tt===t?TC[tt]:'#555'; }
        });
      }},TL[t]||t.toUpperCase());
    typeBtnEls[t]=b;
    typeBtns.appendChild(b);
  });
  typeDiv.appendChild(typeBtns);
  sheet.appendChild(typeDiv);

  // Planned vs actual
  if(planSession?.km||planSession?.vert||planSession?.hrs){
    sheet.appendChild(div({style:{display:'flex',gap:'14px',marginBottom:'8px',padding:'8px',background:'#0a0a18',borderRadius:'6px'}},[
      span({style:{fontSize:'9px',color:'#333'}},'PLANNED:'),
      span({style:{fontSize:'10px',color:'#444'}},planSession.km+'km'),
      span({style:{fontSize:'10px',color:'#444'}},planSession.vert+'m'),
      span({style:{fontSize:'10px',color:'#444'}},planSession.hrs+'hr'),
    ]));
  }

  // Actual inputs
  const actGrid=div({class:'grid3',style:{marginBottom:'12px'}});
  [['km',akm,v=>akm=v,'km'],['m',avert,v=>avert=v,'m'],['hr',ahrs,v=>ahrs=v,'hr']].forEach(([unit,val,cb,u])=>{
    const i=inp({type:'number',value:val,placeholder:'0',style:{background:'#0e0e1f',border:'1px solid #22223a',color:'#e0e0ff',padding:'7px 8px',borderRadius:'5px',fontSize:'13px',outline:'none',width:'100%'}});
    i.addEventListener('input',()=>cb(i.value));
    actGrid.appendChild(div({},[lbl(u),i]));
  });
  sheet.appendChild(actGrid);

  const rGrid=div({class:'grid2',style:{marginBottom:'12px'}});
  rGrid.appendChild(selField('Performance',perf,[{v:'5',l:'5 Exceeded'},{v:'4',l:'4 Solid'},{v:'3',l:'3 Met plan'},{v:'2',l:'2 Below'},{v:'1',l:'1 Poor'}],v=>perf=v));
  rGrid.appendChild(selField('Execution',exec,[{v:'5',l:'5 Perfect'},{v:'4',l:'4 Good'},{v:'3',l:'3 OK'},{v:'2',l:'2 Struggled'},{v:'1',l:'1 Fell apart'}],v=>exec=v));
  sheet.appendChild(rGrid);

  const noteWrap=div({style:{marginBottom:'14px'}});
  noteWrap.appendChild(lbl('Note'));
  const ta=el('textarea',{class:'inp',rows:'2',placeholder:'How did it feel?'},note);
  ta.addEventListener('input',()=>note=ta.value);
  noteWrap.appendChild(ta);
  sheet.appendChild(noteWrap);

  const btnRow=div({style:{display:'flex',gap:'8px'}});
  const saveBtn=btn({class:'btn btn-ok',style:{flex:'1'},onclick:()=>{
    const updated=[...getDayActivities(wIdx,dIdx)];
    updated[aIdx]={
      id:existing.id||newActId(),
      label, type,
      actualKm:akm, actualVert:avert, actualHrs:ahrs,
      perf, exec, note,
      completed:true, ts:Date.now()
    };
    saveDayActivities(wIdx,dIdx,updated);
    overlay.remove(); render();
  }},'SAVE');
  const closeBtn=btn({class:'btn-sm btn-ghost',onclick:()=>overlay.remove()},'Close');
  btnRow.appendChild(saveBtn); btnRow.appendChild(closeBtn);
  sheet.appendChild(btnRow);

  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
}

  const target=TARGETS[wIdx];

  // Week selector

  },{km:0,vert:0,hrs:0,done:0});

  // Week header card

  hdrTop.appendChild(div({style:{fontSize:'11px',color:'#555',textAlign:'right'}},actuals.done+'/'+week.days.length+'\ndone'));

  [['KM',actuals.km,target?.km,'#60a5fa'],['VERT',actuals.vert,target?.vert,'#a29bfe'],['HRS',actuals.hrs,target?.hrs,'#ffd166']].forEach(([lb,act,tgt,col])=>{
    const row=div({style:{marginBottom:'8px'}});
    const info=div({style:{display:'flex',justifyContent:'space-between',marginBottom:'3px'}});
    info.appendChild(span({style:{fontSize:'9px',color:'#555'}},lb));
    const actVal=lb==='HRS'?act.toFixed(1):Math.round(act);
    info.appendChild(span({style:{fontSize:'9px',color:'#666'}},actVal+'/'+(tgt||0)+(lb==='KM'?'km':lb==='VERT'?'m':'hr')));
    row.appendChild(info);
    row.appendChild(pbar(act,tgt||1,col));
    hdrCard.appendChild(row);
  });
  wrap.appendChild(hdrCard);

  // Sessions
  week.days.forEach((_,dIdx)=>{
    const s=getSession(wIdx,dIdx);

      background:isExp?'#111128':dayDone?'#0a120a':'#0a0a1a',

    rowBtn.appendChild(span({style:{fontSize:'9px',color:'#4a4a6a',minWidth:'26px'}},s.day));

        });
        ed.appendChild(div({},[lbl('Type'),typeBtns]));
        const ng=div({class:'grid3'});
        [['km',ef.km,'km',v=>ef.km=parseFloat(v)||0],['vert',ef.vert,'m',v=>ef.vert=parseFloat(v)||0],['hrs',ef.hrs,'hr',v=>ef.hrs=parseFloat(v)||0]].forEach(([lb,val,unit,cb])=>{
          ng.appendChild(numInp(lb,val,cb,unit));
        });
        ed.appendChild(ng);
        const di=el('textarea',{class:'inp',rows:'2'},ef.detail);
        di.addEventListener('input',()=>ef.detail=di.value);
        ed.appendChild(div({},[lbl('Detail'),di]));
        const sbtn=btn({class:'btn btn-ok',style:{marginBottom:'0'},onclick:()=>{EDITS['w'+wIdx+'-d'+dIdx]=ef;S.set(SK.edits,EDITS);EDITING_DAY=null;render();}},'Save');
        const cbtn=btn({class:'btn-sm btn-ghost',onclick:()=>{EDITING_DAY=null;render();}},'Cancel');
        ed.appendChild(div({style:{display:'flex',gap:'8px'}},[sbtn,cbtn]));
        panel.appendChild(ed);
      }
      wrap.appendChild(panel);
    }
  });

  return wrap;
}

// ============================================================
// TREND TAB
// ============================================================
function renderTrend(){
  const wrap=div({});
  const entries=Object.entries(LOG).sort((a,b)=>a[0].localeCompare(b[0])).slice(-14);
  const decisions=entries.map(([,e])=>e.decision).filter(Boolean);
  const backOff=decisions.filter(d=>d==='BACK OFF').length;
  const modify=decisions.filter(d=>d==='MODIFY').length;
  const hard=decisions.filter(d=>d==='GO HARD').length;
  const DC={'GO HARD':'#00ff87','AS PLANNED':'#b8ff4f','MODIFY':'#ffd166','BACK OFF':'#ff6b6b'};
  const DH={'GO HARD':52,'AS PLANNED':40,'MODIFY':26,'BACK OFF':14};

  // 7-day bars
  const barWrap=div({style:{marginBottom:'24px'}});
  barWrap.appendChild(div({class:'section-title'},'7-Day Pattern'));
  const bars=div({style:{display:'flex',gap:'6px',alignItems:'flex-end',height:'64px'}});
  const now=new Date();
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(now.getDate()-i);
    const key=localDateStr(d);
    const entry=LOG[key];
    const dc=entry?.decision?(DC[entry.decision]||'#333'):'#1a1a2e';
    const dh=entry?.decision?(DH[entry.decision]||8):8;
    const isToday=key===today();
    const col=div({style:{flex:'1',display:'flex',flexDirection:'column',alignItems:'center',gap:'4px'}});
    col.appendChild(div({style:{width:'100%',height:dh+'px',background:dc,borderRadius:'3px',minHeight:'8px'}}));
    col.appendChild(span({style:{fontSize:'9px',color:isToday?'#e0e0ff':'#333'}},['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()]));
    bars.appendChild(col);
  }
  barWrap.appendChild(bars);
  wrap.appendChild(barWrap);

  // Block signal
  let sig=null;
  if(decisions.length>=5){
    if(backOff>=3) sig={text:'OVERREACH RISK',color:'#ff6b6b',detail:backOff+' back-off days in 14. Consider a down week.'};
    else if(modify+backOff>=5) sig={text:'FATIGUE ACCUMULATING',color:'#ffd166',detail:'Persistent amber/red. Load may be outpacing recovery.'};
    else if(hard>=4&&backOff===0) sig={text:'WINDOW TO PUSH',color:'#00ff87',detail:'Consistent green. Adaptation happening - safe to load.'};
    else sig={text:'LOAD BALANCED',color:'#b8ff4f',detail:'No dominant pattern. Continue as periodised.'};
  }
  const sigCard=card([],{marginBottom:'20px'});
  sigCard.appendChild(div({class:'section-title'},'14-Day Block Signal'));
  if(sig){
    sigCard.appendChild(div({style:{fontSize:'16px',fontFamily:"'Bebas Neue',cursive",letterSpacing:'0.08em',color:sig.color}},sig.text));
    sigCard.appendChild(div({style:{fontSize:'11px',color:'#777',marginTop:'4px'}},sig.detail));
  } else {
    sigCard.appendChild(div({style:{fontSize:'11px',color:'#333'}},'Log 5+ days to unlock.'));
  }
  wrap.appendChild(sigCard);

  // Weekly summary
  const wIdx=curWeek()-1;
  const plan=getPlan();
  const weekRunLogs=(plan[wIdx]?.days||[]).map((_,dIdx)=>getDayActivities(wIdx,dIdx).filter(a=>a.completed)).flat();
  const target=TARGETS[wIdx];
  const wAct=(plan[wIdx]?.days||[]).reduce((acc,_,dIdx)=>{const t=getDayTotals(wIdx,dIdx);acc.km+=t.km;acc.vert+=t.vert;acc.hrs+=t.hrs;return acc;},{km:0,vert:0,hrs:0});
  const doneDays=(plan[wIdx]?.days||[]).filter((_,dIdx)=>isDayDone(wIdx,dIdx)).length;

  const summCard=card([],{marginBottom:'20px'});
  summCard.appendChild(div({class:'section-title'},'Week '+curWeek()+' Coach Summary'));
  const summText=div({style:{fontSize:'12px',color:'#aaa',lineHeight:'1.7',marginBottom:'10px'}},doneDays===0?'Log sessions first.':'Ready to generate.');
  summCard.appendChild(summText);
  const summBtn=btn({class:'btn',style:{width:'auto',display:'inline-block',padding:'8px 14px',fontSize:'11px'},onclick:async()=>{
    if(doneDays===0) return;
    summBtn.textContent='GENERATING...'; summBtn.disabled=true;
    const sessSummaries=(plan[wIdx]?.days||[]).map((_,dIdx)=>{
      const s=getSession(wIdx,dIdx);
      const acts=getDayActivities(wIdx,dIdx).filter(a=>a.completed);
      if(!acts.length) return s.day+' '+(s.label||'Rest')+': NOT DONE';
      return acts.map(a=>s.day+' '+a.label+': '+(a.actualKm||'?')+'km / '+(a.actualVert||'?')+'m / '+(a.actualHrs||'?')+'hr | P:'+(a.perf||'?')+' E:'+(a.exec||'?')+' | "'+(a.note||'')+'"').join('\n');
    }).join('\n');
    const readinessSummary=entries.slice(-7).map(([date,e])=>date+': HRV '+(e.hrv||'?')+' RHR '+(e.rhr||'?')+' -> '+(e.decision||'?')).join('\n');
    const ctx='Week '+curWeek()+' of '+plan.length+' ('+target?.type+') - '+daysToRace()+' days to race\nTarget: '+target?.km+'km / '+target?.vert+'m / '+target?.hrs+'hr\nActual: '+wAct.km.toFixed(1)+'km / '+wAct.vert+'m / '+wAct.hrs.toFixed(1)+'hr ('+doneDays+'/'+(plan[wIdx]?.days.length)+' days done)\n\nSessions:\n'+sessSummaries+'\n\nReadiness:\n'+readinessSummary;
    try{
      const s=await aiCall('You are an experienced ultra trail running coach. Give a weekly debrief to Jaime, a competitive trail ultrarunner. Direct and analytical: volume vs target, session quality, readiness patterns, one focus for next week. 4-6 sentences max. No fluff.',ctx);
      summText.textContent=s;
    }catch(e){summText.textContent='Error - check connection.';}
    summBtn.textContent='REGENERATE'; summBtn.disabled=false;
  }},doneDays===0?'Log sessions first':'Get Week Summary');
  summCard.appendChild(summBtn);
  wrap.appendChild(summCard);

  // Recent log
  wrap.appendChild(div({class:'section-title'},'Recent Log'));
  if(!entries.length) wrap.appendChild(div({style:{fontSize:'11px',color:'#333'}},'No entries yet.'));
  entries.slice().reverse().forEach(([date,entry])=>{
    const dc=DC[entry.decision]||'#555';
    const row=div({class:'row-sep'});
    row.appendChild(span({style:{fontSize:'10px',color:'#444',minWidth:'80px'}},date));
    if(entry.hrv) row.appendChild(span({style:{fontSize:'10px',color:'#60a5fa'}},'HRV '+entry.hrv));
    if(entry.rhr) row.appendChild(span({style:{fontSize:'10px',color:'#a78bfa'}},'RHR '+entry.rhr));
    if(entry.decision) row.appendChild(span({style:{marginLeft:'auto',fontSize:'9px',color:dc,border:'1px solid '+dc+'40',padding:'2px 6px',borderRadius:'4px'}},entry.decision));
    wrap.appendChild(row);
  });

  return wrap;
}

// ============================================================
// SETTINGS TAB
// ============================================================
function renderSettings(){
  const wrap=div({});
  let cfgForm={...CFG};

  // Config card
  const cfgCard=card([],{marginBottom:'16px',display:'flex',flexDirection:'column',gap:'12px'});
  cfgCard.appendChild(div({class:'section-title'},'Configuration'));

  const raceNameI=inp({class:'inp',type:'text',value:cfgForm.raceName});
  raceNameI.addEventListener('input',()=>cfgForm.raceName=raceNameI.value);
  cfgCard.appendChild(div({},[lbl('Race name'),raceNameI]));

  const dg=div({class:'grid2'});
  const rdI=inp({class:'inp',type:'date',value:cfgForm.raceDateStr});
  rdI.addEventListener('input',()=>cfgForm.raceDateStr=rdI.value);
  const bsI=inp({class:'inp',type:'date',value:cfgForm.blockStartStr});
  bsI.addEventListener('input',()=>cfgForm.blockStartStr=bsI.value);
  dg.appendChild(div({},[lbl('Race date'),rdI]));
  dg.appendChild(div({},[lbl('Block start'),bsI]));
  cfgCard.appendChild(dg);

  const weeksInfo=div({style:{padding:'8px 10px',background:'#0a0a18',border:'1px solid #1c1c2e',borderRadius:'6px',fontSize:'10px',color:'#555'}},'Calculated weeks will show on save');
  cfgCard.appendChild(weeksInfo);

  const hg=div({class:'grid2'});
  const hvlI=inp({class:'inp',type:'number',value:cfgForm.hrvLow});
  hvlI.addEventListener('input',()=>cfgForm.hrvLow=parseFloat(hvlI.value)||45);
  const hvhI=inp({class:'inp',type:'number',value:cfgForm.hrvHigh});
  hvhI.addEventListener('input',()=>cfgForm.hrvHigh=parseFloat(hvhI.value)||70);
  hg.appendChild(div({},[lbl('HRV low (ms)'),hvlI]));
  hg.appendChild(div({},[lbl('HRV high (ms)'),hvhI]));
  cfgCard.appendChild(hg);

  const rg=div({class:'grid2'});
  const rlI=inp({class:'inp',type:'number',value:cfgForm.rhrLow});
  rlI.addEventListener('input',()=>cfgForm.rhrLow=parseFloat(rlI.value)||45);
  const rhI=inp({class:'inp',type:'number',value:cfgForm.rhrHigh});
  rhI.addEventListener('input',()=>cfgForm.rhrHigh=parseFloat(rhI.value)||50);
  rg.appendChild(div({},[lbl('RHR low (bpm)'),rlI]));
  rg.appendChild(div({},[lbl('RHR high (bpm)'),rhI]));
  cfgCard.appendChild(rg);

  const savCfgBtn=btn({class:'btn',onclick:()=>{
    CFG=cfgForm; S.set(SK.cfg,CFG);
    // Rebuild targets if week count changed
    const newTW=totalWeeks();
    if(TARGETS.length!==newTW){
      const newT=buildTargets();
      TARGETS=newT.map((t,i)=>TARGETS[i]||t);
      S.set(SK.targets,TARGETS);
    }
    savCfgBtn.textContent='SAVED'; savCfgBtn.style.color='#00ff87'; savCfgBtn.style.borderColor='#00ff87';
    setTimeout(()=>{render();},800);
  }},'Save Config');
  cfgCard.appendChild(savCfgBtn);
  wrap.appendChild(cfgCard);

  // Backup card
  const bkCard=card([],{marginBottom:'16px',display:'flex',flexDirection:'column',gap:'10px'});
  bkCard.appendChild(div({class:'section-title'},'Data Backup'));
  bkCard.appendChild(btn({class:'btn',onclick:exportAll},'Export all data (JSON backup)'));

  const importInfo=div({style:{fontSize:'11px',color:'#555'}});
  const fileI=inp({type:'file',accept:'.json',style:{display:'none'}});
  fileI.addEventListener('change',()=>{
    const file=fileI.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const msg=importAll(ev.target.result);
      importInfo.textContent=msg;
      if(msg.includes('Reloading')) setTimeout(()=>location.reload(),1200);
    };
    reader.readAsText(file);
  });
  bkCard.appendChild(div({},[
    btn({class:'btn',onclick:()=>fileI.click()},'Import backup file'),
    fileI,
    importInfo,
  ]));
  wrap.appendChild(bkCard);

  // Activity totals toggle card
  const totalsCard=card([],{marginBottom:'16px',display:'flex',flexDirection:'column',gap:'10px'});
  totalsCard.appendChild(div({class:'section-title'},'Daily Totals — Activity Types'));
  totalsCard.appendChild(div({style:{fontSize:'10px',color:'#555',lineHeight:'1.7'}},'These activity types contribute to daily km/vert/hr totals and weekly progress bars.'));
  const toggleGrid=div({style:{display:'flex',gap:'6px',flexWrap:'wrap'}});
  const countTypes=CFG.countTypes||DEFAULT_COUNT_TYPES;
  ALL_TYPES.forEach(t=>{
    const active=countTypes.includes(t);
    const tc2=TC[t]||'#555';
    const b=btn({style:{padding:'5px 10px',borderRadius:'4px',fontSize:'10px',
      background:active?tc2+'25':'#0a0a18',border:'1px solid '+(active?tc2:'#2a2a4a'),
      color:active?tc2:'#444'},
      onclick:()=>{
        const cur=CFG.countTypes||[...DEFAULT_COUNT_TYPES];
        const idx=cur.indexOf(t);
        if(idx>=0) cur.splice(idx,1); else cur.push(t);
        CFG.countTypes=[...cur]; S.set(SK.cfg,CFG);
        b.style.background=cur.includes(t)?tc2+'25':'#0a0a18';
        b.style.borderColor=cur.includes(t)?tc2:'#2a2a4a';
        b.style.color=cur.includes(t)?tc2:'#444';
      }},TL[t]||t.toUpperCase());
    toggleGrid.appendChild(b);
  });
  totalsCard.appendChild(toggleGrid);
  wrap.appendChild(totalsCard);

  // TrainingPeaks iCal card
  const tpCard=card([],{marginBottom:'16px',display:'flex',flexDirection:'column',gap:'10px'});

  const tpHdrRow=div({style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'2px'}});
  tpHdrRow.appendChild(div({class:'section-title',style:{marginBottom:'0'}},'TrainingPeaks Calendar'));
  const tpHelpBtn=btn({style:{padding:'0 6px',height:'18px',borderRadius:'9px',fontSize:'9px',background:'#1a1a2e',border:'1px solid #2a2a4a',color:'#888',lineHeight:'18px'},onclick:showTPInstructions},'?');
  tpHdrRow.appendChild(tpHelpBtn);
  tpCard.appendChild(tpHdrRow);

  tpCard.appendChild(div({style:{fontSize:'10px',color:'#555',lineHeight:'1.7'}},'Paste raw iCal text from your iOS Shortcut. Tap ? for setup instructions.'));

  const icsStatus=div({style:{fontSize:'11px',minHeight:'16px'}});
  const icsTa=el('textarea',{class:'inp',rows:'4',placeholder:'Paste iCal text here (BEGIN:VCALENDAR...)'},'');
  icsTa.style.fontFamily='monospace';
  icsTa.style.fontSize='10px';
  icsTa.style.color='#555';
  tpCard.appendChild(icsTa);

  const tpBtnRow=div({style:{display:'flex',gap:'8px'}});
  tpBtnRow.appendChild(btn({class:'btn btn-ok',style:{flex:'1'},onclick:()=>{
    const text=icsTa.value.trim();
    if(!text){icsStatus.textContent='Paste iCal text first.';icsStatus.style.color='#ff6b6b';return;}
    if(!text.includes('BEGIN:VCALENDAR')){icsStatus.textContent='Not valid iCal — check you copied the full calendar text.';icsStatus.style.color='#ff6b6b';return;}
    const result=applyICSToEdits(text);
    icsStatus.textContent=result.msg;
    icsStatus.style.color=result.ok?'#00ff87':'#ff6b6b';
    if(result.ok){ icsTa.value=''; setTimeout(()=>render(),1200); }
  }},'Import Calendar'));
  tpBtnRow.appendChild(btn({class:'btn-sm btn-ghost',onclick:showTPInstructions},'How?'));
  tpCard.appendChild(tpBtnRow);
  tpCard.appendChild(icsStatus);

  // Show current TP session count
  const tpEdits=Object.keys(EDITS).length;
  if(tpEdits>0){
    tpCard.appendChild(div({style:{fontSize:'10px',color:'#4a4a6a',borderTop:'1px solid #1a1a2e',paddingTop:'8px'}},tpEdits+' plan sessions currently overridden (from TP or manual edits)'));
  }

  wrap.appendChild(tpCard);

  // CSV card
  const csvCard=card([],{marginBottom:'16px',display:'flex',flexDirection:'column',gap:'10px'});
  csvCard.appendChild(div({class:'section-title'},'Plan Export / Import'));
  csvCard.appendChild(btn({class:'btn',onclick:()=>download(planToCSV(),'training-plan.csv','text/csv')},'Export plan as CSV'));

  const csvInfo=div({style:{fontSize:'11px',color:'#555'}});
  const csvI=inp({type:'file',accept:'.csv',style:{display:'none'}});
  csvI.addEventListener('change',()=>{
    const file=csvI.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const result=csvToEdits(ev.target.result);
        EDITS=result.edits; S.set(SK.edits,EDITS);
        csvInfo.textContent='Imported '+result.importedCount+' sessions from CSV.';
        csvInfo.style.color='#00ff87';
      }catch(e){csvInfo.textContent='CSV import failed: '+e.message;csvInfo.style.color='#ff6b6b';}
    };
    reader.readAsText(file);
  });
  csvCard.appendChild(div({style:{fontSize:'9px',color:'#555',lineHeight:'1.6'}},'Export first for correct column format. Edit in Numbers or Excel, then import back.'));
  csvCard.appendChild(div({},[btn({class:'btn',onclick:()=>csvI.click()},'Import CSV plan'),csvI,csvInfo]));
  wrap.appendChild(csvCard);

  // Reset card
  const resetCard=card([],{display:'flex',flexDirection:'column',gap:'10px'});
  resetCard.appendChild(div({class:'section-title'},'Reset'));
  resetCard.appendChild(btn({class:'btn btn-danger',onclick:()=>{
    if(confirm('Reset all plan edits?')){EDITS={};S.set(SK.edits,{});render();}
  }},'Reset plan edits'));
  resetCard.appendChild(btn({class:'btn btn-danger',onclick:()=>{
    if(confirm('Reset block targets to defaults?')){TARGETS=buildTargets();S.set(SK.targets,TARGETS);render();}
  }},'Reset block targets'));
  wrap.appendChild(resetCard);

  wrap.appendChild(div({style:{marginTop:'20px',fontSize:'9px',color:'#333',lineHeight:'1.8'}},'All data in browser storage. Export regularly to avoid loss on browser clear.\nSafari: Share > Add to Home Screen for full-screen app.'));

  return wrap;
}

  const dateLookup={};

    wk.days.forEach((d,dIdx)=>{
      const dateStr=slotDate(wIdx,d.day);
      dateLookup[dateStr]={wIdx,dIdx};
    });
  });

  // Strava activities mapped to run logs
  // Format: [dateStr, label, km, vertM, hrs, perf, exec, note]
  const activities=[
    // Pre-UTA taper
    ['2026-05-09','BMMG Shakeout / UTA11 course scope',10.3,545,1.3,3,3,'Course scope before UTA'],
    ['2026-05-12','EZ45 - taper run',7.9,74,0.75,3,3,'4 sleeps to go. Easy.'],
    ['2026-05-13','Poppin - carbon zing',10.5,111,0.85,3,4,'Legs feeling zingy in race shoes'],
    ['2026-05-15','Shakeout 4x20sec',3.4,47,0.27,2,3,'Pre-race shakeout'],

    ['2026-05-24','Faulco Social + Upper Strength',13.2,232,1.2,3,4,'Great social run with the boys'],

    ['2026-05-28','Morning Ridge',17.6,304,1.7,3,4,'Ridiculous DOMS from not training legs properly for 2-3 weeks. Great to be moving.'],

    ['2026-05-31','Grose Valley Tour',20.5,1268,3.2,4,4,'Fun morning with Jinwoo and the boys. Only goal: run horse track. Done.'],
    ['2026-06-01','Morning Weight Training - Upper',0,0,0.9,3,3,'Upper session'],
    ['2026-06-02','Back in the Lab - 4x6min intervals',13,49,0.95,4,5,'Target 3:50/km. Last rep spicy. 16 PRs.'],
    ['2026-06-03','Morning Weight Training - Legs + Uphill Treadmill',3,450,1.25,4,4,'Squat, lunge, Zercher, RDL, calf, tib. 450m treadmill vert.'],
    ['2026-06-04','Grand View FT Hill Reps',12.2,523,1.2,4,4,'3.25 reps ~45min. Race-specific stimulus.'],
    ['2026-06-05','Morning Grose - Easy Long',20,381,1.9,3,4,'Cheeky KOM hunt at the end. 2 PRs.'],
    ['2026-06-06','Korowal Kapers - Big Day',36.8,2194,4.9,5,5,'Unreal training run. 5hrs in the bush solo. 34 PRs. Biggest day of the block.'],
    ['2026-06-08','Morning Weight Training - Upper',0,0,0.9,3,3,'Upper session'],
  ];

  const newRuns={...RUNS};
  activities.forEach(([dateStr,label,km,vert,hrs,perf,exec,note])=>{

    const {wIdx,dIdx}=slot;

  RUNS=newRuns;

}
