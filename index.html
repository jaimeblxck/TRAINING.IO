  hdrBadges.appendChild(span({style:{fontSize:'9px',color:'#4a6080'}},fmtDate(pwMon)+' - '+fmtDate(pwSun)));
  if(EDIT_WEEK===curWeek()) hdrBadges.appendChild(span({style:{fontSize:'8px',color:'#b8ff4f'}},'CURRENT'));
  hdrLeft.appendChild(hdrBadges);
  // Target line -- always light text since card is always dark
  hdrLeft.appendChild(div({style:{fontSize:'12px',color:'#c0ccee',letterSpacing:'0.04em',marginBottom:'8px'}},
    'TARGET: '+(target?.km||0)+'km · '+(target?.vert||0)+'m · '+(target?.hrs||0)+'hr'));
  hdrTop.appendChild(hdrLeft);
  hdrTop.appendChild(div({style:{fontSize:'11px',color:'#6080a0',textAlign:'right'}},actuals.done+'/'+week.days.length+' done'));
  hdrCard.appendChild(hdrTop);

  // Progress bars -- sit between TARGET and metrics rows
  const planned=week.days.reduce((acc,_,dIdx)=>{
    const dp=getDayPlanned(wIdx,dIdx,true);
    acc.km+=dp.km||0; acc.vert+=dp.vert||0; acc.hrs+=dp.hrs||0;
    return acc;
  },{km:0,vert:0,hrs:0});

  [['#00ff87','km',actuals.km,target?.km||0],
   ['#55efc4','vert',actuals.vert,target?.vert||0],
   ['#b8ff4f','hrs',actuals.hrs,target?.hrs||0]
  ].forEach(([col,unit,act,tgt])=>{
    const over=act>tgt&&tgt>0;
    const barColor=over?'#e84040':col;
    const pct=tgt>0?Math.min(100,(act/tgt)*100):0;
    const barWrap=div({style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'4px'}});
    const track=div({class:'pbar-track',style:{flex:'1',height:'6px',borderRadius:'3px',overflow:'hidden',position:'relative'}});
    track.style.setProperty('--pbar-color',barColor);
    const fill=div({style:{width:pct+'%',height:'100%',borderRadius:'3px',background:barColor,transition:'width 0.4s'}});
    track.appendChild(fill);
    barWrap.appendChild(track);
    barWrap.appendChild(span({style:{fontSize:'8px',color:barColor,minWidth:'22px',textAlign:'right',flexShrink:'0'}},unit));
    hdrCard.appendChild(barWrap);
  });

  // PLANNED + LOGGED as explicit flex rows -- guaranteed alignment
  [['PLANNED',planned.km,planned.vert,planned.hrs,'#4a6080','#8aa0c0'],
   ['LOGGED',actuals.km,actuals.vert,actuals.hrs,'#00c875','#00c875']
  ].forEach(([label,km,vert,hrs,lblCol,valCol])=>{
    const row=div({style:{display:'flex',alignItems:'baseline',gap:'0',marginTop:'5px'}});
    row.appendChild(span({style:{fontSize:'8px',color:lblCol,letterSpacing:'0.1em',minWidth:'58px',flexShrink:'0'}},label));
    const fmtKm=Math.round(km)>999?(Math.round(km)/1000).toFixed(1)+'k':Math.round(km)+'km';
    const fmtVert=Math.round(vert)>999?(Math.round(vert)/1000).toFixed(1)+'k':Math.round(vert)+'m';
    [fmtKm,fmtVert,fmtHrTot(hrs)].forEach(v=>{
      row.appendChild(span({style:{fontSize:'10px',color:valCol,flex:'1'}},v));
    });
    hdrCard.appendChild(row);
  });
  wrap.appendChild(hdrCard);

  // Sessions
  week.days.forEach((_,dIdx)=>{
    const s=getSession(wIdx,dIdx);
    const activities=getDayActivities(wIdx,dIdx);
    const dayDone=isDayDone(wIdx,dIdx);
    const totals=getDayTotals(wIdx,dIdx);
    const isEdited=!!EDITS['w'+wIdx+'-d'+dIdx];
    const isExp=EXPANDED_DAY===dIdx;
    const tc=TC[s.type]||'#555';
    const dateStr=slotDate(wIdx,s.day);

    // Day-level planned totals for expanded panel
    const _dp=getDayPlanned(wIdx,dIdx,false);
    const dayPlannedKm=_dp.km, dayPlannedVert=_dp.vert, dayPlannedHrs=_dp.hrs;

    // Collapsed row -- show first/main activity label, day totals
    const firstAct=activities[0];
    const mainLabel=activities.length>0
      ?(firstAct?.label||s.label||'')
      :'';
    const showLabel=mainLabel+(activities.length>1?' +'+(activities.length-1):'');

    const rowBtn=btn({style:{width:'100%',textAlign:'left',padding:'9px 12px',
      background:isExp?'var(--bg-elev)':dayDone?'#00c96e12':'var(--bg-card)',
      border:'1px solid '+(isExp?tc+'50':dayDone?'#00c96e40':'var(--border)'),
      borderRadius:isExp?'8px 8px 0 0':'8px',display:'flex',flexDirection:'column',gap:'4px',marginBottom:isExp?'0':'5px'},
      onclick:()=>{EXPANDED_DAY=isExp?null:dIdx;render();}});
    // Top line: day/date left -- type badges centre -- totals/chevron right
    const topRow=div({style:{display:'flex',alignItems:'center',gap:'6px'}});

    // Done tick or day+date

            if(plannedHrs) pmRow.appendChild(span({style:{fontSize:'10px',color:'var(--text-dim)'}},fmtHms(plannedHrs)));
            if(pmRow.children.length) actRow.appendChild(pmRow);
            if(act.detail) actRow.appendChild(div({style:{fontSize:'10px',color:'var(--text-mute)',lineHeight:'1.6',marginTop:'2px'}},act.detail));
            // Only show Log button for today or past
            if(dateStr<=today()){
              actRow.appendChild(btn({style:{marginTop:'6px',padding:'5px 12px',borderRadius:'5px',fontSize:'10px',background:'var(--bg-btn)',border:'1px solid var(--border-btn)',color:'var(--text)'},

          }
          pd.appendChild(actRow);

        // Add activity button

  return wrap;

// Vert density multiplier: kicks in above 30m/km, caps at 3x
function vertMultiplier(km, vert){
  if(!km||km<=0) return 1;
  const ratio=vert/km;
  return Math.min(3.0, 1 + Math.max(0,(ratio-30)/70));
}

// Training Stress Score proxy for a single activity
// RPE (0-10) x hrs x vertMultiplier
function activityTSS(act){
  const rpe=parseFloat(act.exec||0);
  const hrs=parseFloat(act.actualHrs||0);
  const km=parseFloat(act.actualKm||0);
  const vert=parseFloat(act.actualVert||0);
  return rpe * hrs * vertMultiplier(km, vert);
}

// Total TSS for a calendar date string
function dateTSS(dateStr){
  const plan=getPlan();
  const d=new Date(dateStr+'T12:00:00');
  const diffDays=Math.floor((d-getBlockMonday())/86400000);
  if(diffDays<0) return 0;
  const wIdx=Math.floor(diffDays/7);
  const dow=d.getDay();
  if(!plan[wIdx]) return 0;
  const dIdx=plan[wIdx].days.findIndex(s=>dowIndex(s.day)===dow);
  if(dIdx<0) return 0;
  return getDayActivities(wIdx,dIdx)
    .filter(a=>a.completed)
    .reduce((sum,a)=>sum+activityTSS(a),0);
}

// ATL: exponentially weighted 7-day load (k=0.87)
// CTL: exponentially weighted 28-day load (k=0.97)
function computeATLCTL(days){
  let atl=0, ctl=0;
  const kAtl=0.87, kCtl=0.97;
  days.forEach(({tss})=>{
    atl = atl*kAtl + tss*(1-kAtl);
    ctl = ctl*kCtl + tss*(1-kCtl);
  });
  return {atl, ctl, ratio:ctl>0?atl/ctl:null};
}

function renderTrend(){
  const wrap=div({});
  const DC={'GO HARD':'#00ff87','AS PLANNED':'#b8ff4f','MODIFY':'#ffd166','BACK OFF':'#ff6b6b'};

  function buildDays(n){
    const now=new Date(), out=[];
    for(let i=n-1;i>=0;i--){
      const d=new Date(now); d.setDate(now.getDate()-i);
      const ds=localDateStr(d);
      const le=LOG[ds]||{};
      out.push({ds,d,dayLabel:['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()],
        isToday:ds===today(),isWeekStart:d.getDay()===1,
        tss:dateTSS(ds),decision:le.decision||null,hrv:le.hrv||null});
    }
    return out;
  }

  function buildChart(days,loadH,readyH,compact){
    const maxTSS=Math.max(...days.map(d=>d.tss),0.1);
    const logMax=Math.log1p(maxTSS);
    const gap=compact?2:4;
    const wrap2=div({style:{marginBottom:'4px'}});
    const chart=div({style:{display:'flex',gap:gap+'px',alignItems:'stretch'}});

    days.forEach(day=>{
      const col=div({style:{flex:'1',display:'flex',flexDirection:'column',minWidth:'0'}});

      // Load bar (up)
      const lc=div({style:{height:loadH+'px',display:'flex',flexDirection:'column',justifyContent:'flex-end'}});
      if(day.tss>0){
        const bh=Math.max(2,Math.round((Math.log1p(day.tss)/logMax)*loadH));
        // Get dominant activity type colour
        const pd=new Date(day.ds+'T12:00:00');
        const diffD=Math.floor((pd-getBlockMonday())/86400000);
        const wI=Math.max(0,Math.floor(diffD/7));
        const plan=getPlan();
        const dI=plan[wI]?.days.findIndex(s=>dowIndex(s.day)===pd.getDay())??-1;
        const acts=dI>=0?getDayActivities(wI,dI).filter(a=>a.completed):[];
        let topColor='#60a5fa';
        if(acts.length){const top=acts.reduce((a,b)=>activityTSS(a)>=activityTSS(b)?a:b);topColor=TC[top.type||'easy']||'#60a5fa';}
        lc.appendChild(div({style:{width:'100%',height:bh+'px',background:topColor,borderRadius:'2px 2px 0 0',opacity:'0.85'}}));
      }
      col.appendChild(lc);

      // Centre divider
      col.appendChild(div({style:{height:'1px',background:day.isWeekStart?'#2a2a4a':'#111',flexShrink:'0'}}));

      // Readiness bar (down)
      const rc=div({style:{height:readyH+'px',display:'flex',flexDirection:'column',justifyContent:'flex-start'}});
      if(day.decision){
        const dc=DC[day.decision]||'#333';
        const rmap={'GO HARD':readyH,'AS PLANNED':Math.round(readyH*0.75),'MODIFY':Math.round(readyH*0.5),'BACK OFF':Math.round(readyH*0.25)};
        rc.appendChild(div({style:{width:'100%',height:(rmap[day.decision]||4)+'px',background:dc,borderRadius:'0 0 2px 2px',opacity:'0.9'}}));
      } else {
        rc.appendChild(div({style:{width:'100%',height:'2px',background:'#1a1a2e',marginTop:'2px'}}));

      leg.appendChild(span({style:{fontSize:'8px',color:'#333'}},'\u25b2 Load (RPE\u00d7hrs\u00d7vert)'));
      leg.appendChild(span({style:{fontSize:'8px',color:'#333'}},'\u25bc Readiness'));
      wrap2.appendChild(leg);

        span({style:{fontSize:'8px',color:isReliable?'#00ff87':'#ffd166'}},confPct+'% ('+(isReliable?'reliable':'building')+' -- '+nLogged+'/28 days)'),
      ]);

      confTrack.style.setProperty('--pbar-color',isReliable?'#00c875':'#ffd166');
      confTrack.appendChild(div({class:'pbar-fill',style:{width:confPct+'%',background:isReliable?'#00c875':'#ffd166'}}));
      confRow.appendChild(confTrack);

          'Early data -- ratio is directional only. A reading is available but CTL hasn\'t had enough history to fully stabilise. Use alongside your subjective feel and HRV, not as a standalone signal.'));
      }

      const rc=!ratio?'#555':!isReliable?'#555':ratio>1.8?'#ff6b6b':ratio>1.4?'#ffd166':ratio<0.7?'#74b9ff':'#00ff87';

      const ratioRow=div({style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'4px'}});
      ratioRow.appendChild(span({style:{fontSize:'10px',color:rc}},rl));
      ratioRow.appendChild(span({style:{fontSize:'22px',fontFamily:"'Bebas Neue',cursive",color:rc}},ratio?ratio.toFixed(2):'--'));
      atlBox.appendChild(ratioRow);

      const detailRow=div({style:{display:'flex',gap:'16px',marginBottom:'4px'}});
      detailRow.appendChild(span({style:{fontSize:'9px',color:'#444'}},'ATL (7d): '+atl.toFixed(1)));
      detailRow.appendChild(span({style:{fontSize:'9px',color:'#444'}},'CTL (28d): '+ctl.toFixed(1)));
      atlBox.appendChild(detailRow);

      if(!isReliable){
        atlBox.appendChild(div({style:{fontSize:'9px',color:'#555',lineHeight:'1.6',marginTop:'2px'}},
          'Log 7+ sessions to unlock ratio ('+nLogged+' so far).'));
      } else if(ratio){
        atlBox.appendChild(div({style:{fontSize:'9px',color:'#333',lineHeight:'1.6',marginTop:'2px'}},
          ratio>1.8?'Acute load well above chronic baseline. Prioritise recovery.':
          ratio>1.4?'Load is elevated -- watch HRV and sleep. Normal for a build week with big vert.':
          ratio<0.7?'Training below chronic baseline. Safe to increase load if feeling good.':
          'Load and recovery in balance.'));
      }
    }
    loadBody.appendChild(atlBox);
  }

  [7,14,28].forEach(n=>{
    const b=btn({style:{padding:'4px 10px',borderRadius:'4px',fontSize:'10px',
      background:loadRange===n?'var(--bg-tab-active)':'var(--bg-input)',
      border:'1px solid '+(loadRange===n?'var(--border-btn)':'var(--border)'),
      color:loadRange===n?'var(--text)':'var(--text-dim)'},
      onclick:()=>{
        loadRange=n;
        loadToggle.querySelectorAll('button').forEach((b2,i2)=>{
          const nn=[7,14,28][i2];
          b2.style.background=nn===n?'var(--bg-tab-active)':'var(--bg-input)';
          b2.style.borderColor=nn===n?'var(--border-btn)':'var(--border)';
          b2.style.color=nn===n?'var(--text)':'var(--text-dim)';
        });
        rebuildLoad();
      }},n+'d');
    loadToggle.appendChild(b);
  });
  loadHdr.appendChild(loadToggle);
  loadCard.appendChild(loadHdr);
  loadCard.appendChild(loadBody);
  rebuildLoad();
  wrap.appendChild(loadCard);


  // ── Compliance tracker ─────────────────────────────────────────
  const compCard=card([],{marginBottom:'14px'});
  const compHdr=div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}});
  compHdr.appendChild(div({class:'section-title',style:{marginBottom:'0'}},'Session Compliance'));

  // Range toggle
  let compRange=7;
  const compToggle=div({style:{display:'flex',gap:'4px'}});
  const compBody=div({});

  function buildCompliance(){
    compBody.innerHTML='';
    const COMPLIANCE_TYPES=['run','easy','long','intervals','strength','ride','race'];

    try{
      const now=new Date();
      const blockMon=getBlockMonday();
      const plan=getPlan();
      const compDays=[];

      for(let i=compRange-1;i>=0;i--){
        const d=new Date(now); d.setDate(now.getDate()-i);
        const ds=localDateStr(d);
        const dayLabel=['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()];
        const isWeekStart=d.getDay()===1;
        const isToday=ds===today();

        const dd=new Date(ds+'T12:00:00');
        const diffD=Math.floor((dd-blockMon)/86400000);
        if(isNaN(diffD)||diffD<0){
          compDays.push({ds,acts:[],dayLabel,isWeekStart,isToday});
          continue;
        }
        const wI=Math.floor(diffD/7);
        if(wI>=plan.length){
          compDays.push({ds,acts:[{perf:'3',_rest:true}],dayLabel,isWeekStart,isToday});
          continue;
        }
        const dow=dd.getDay();
        const dI=plan[wI].days.findIndex(s=>dowIndex(s.day)===dow);
        const allActs=dI>=0?getDayActivities(wI,dI):[];
        const relPlanned=allActs.filter(a=>COMPLIANCE_TYPES.includes(a.type||'easy'));
        let acts=[];
        if(relPlanned.length===0){
          // No relevant activities - rest day, counts as met plan
          acts=[{perf:'3',_rest:true}];
        } else {
          acts=relPlanned.map(a=>{
            if(a.completed&&a.perf) return a;
            if(a.completed&&!a.perf) return {...a,perf:'3'};
            return {...a,perf:'1'}; // planned but not logged = poor
          });
        }
        compDays.push({ds,acts,dayLabel,isWeekStart,isToday});
      }

      // Stats
      const rated=compDays.filter(d=>d.acts.length>0);
      const exceeded=rated.filter(d=>d.acts.some(a=>parseInt(a.perf)>3)).length;
      const metPlan=rated.filter(d=>d.acts.every(a=>parseInt(a.perf)===3)).length;
      const below=rated.filter(d=>d.acts.some(a=>parseInt(a.perf)<3)).length;

      // Chart
      const BAR_H=28;
      const chartH=BAR_H*2+2+BAR_H*2;

      const zeroLine=div({style:{position:'absolute',left:'0',right:'0',top:BAR_H*2+'px',height:'1px',background:'#2a2a4a',zIndex:'1'}});
      const colWrap=div({style:{display:'flex',gap:(compRange>14?2:4)+'px',width:'100%',position:'relative',zIndex:'2'}});

      compDays.forEach(day=>{
        const col=div({style:{flex:'1',height:chartH+'px',position:'relative'}});

        const perfVals=day.acts.map(a=>parseInt(a.perf)).filter(v=>v>=1&&v<=5);
        const avgPerf=perfVals.length?perfVals.reduce((s,v)=>s+v,0)/perfVals.length:null;

        if(avgPerf!==null){
          const dev=avgPerf-3;
          const color=dev>0?'#00c96e':dev<0?'#e84040':'#4a6080';
          if(dev>0){
            col.appendChild(div({style:{position:'absolute',bottom:(BAR_H*2+1)+'px',left:'1px',right:'1px',height:Math.max(2,Math.abs(dev)*BAR_H)+'px',background:color,borderRadius:'2px 2px 0 0',opacity:'0.85'}}));
          } else if(dev<0){
            col.appendChild(div({style:{position:'absolute',top:(BAR_H*2+1)+'px',left:'1px',right:'1px',height:Math.max(2,Math.abs(dev)*BAR_H)+'px',background:color,borderRadius:'0 0 2px 2px',opacity:'0.85'}}));
          } else {
            col.appendChild(div({style:{position:'absolute',top:(BAR_H*2-2)+'px',left:'50%',transform:'translateX(-50%)',width:'4px',height:'4px',background:color,borderRadius:'50%'}}));
          }
        }
        if(day.isWeekStart) col.appendChild(div({style:{position:'absolute',left:'0',top:'0',bottom:'0',width:'1px',background:'#2a2a4a'}}));
        if(compRange<=14) col.appendChild(div({style:{position:'absolute',bottom:'-14px',left:'0',right:'0',textAlign:'center',fontSize:'7px',color:day.isToday?'var(--text)':'#333'}},day.dayLabel));
        colWrap.appendChild(col);
      });

      const chartWrap=div({style:{position:'relative',height:chartH+'px',marginBottom:'18px'}});
      chartWrap.appendChild(zeroLine);
      chartWrap.appendChild(colWrap);
      compBody.appendChild(chartWrap);

      // Legend
      const leg=div({style:{display:'flex',gap:'12px',marginBottom:'8px'}});
      [['#00c96e','Exceeded'],['#4a6080','Met plan'],['#e84040','Below']].forEach(([c,l])=>{
        const item=div({style:{display:'flex',alignItems:'center',gap:'4px'}});
        item.appendChild(div({style:{width:'8px',height:'8px',background:c,borderRadius:'1px',flexShrink:'0'}}));
        item.appendChild(span({style:{fontSize:'8px',color:'#555'}},l));
        leg.appendChild(item);
      });
      compBody.appendChild(leg);

      // Pills
      if(rated.length>0){
        const pills=div({style:{display:'flex',gap:'6px',flexWrap:'wrap',alignItems:'center'}});
        [[exceeded,'#00c96e','Exceeded'],[metPlan,'#4a6080','Met plan'],[below,'#e84040','Below']].forEach(([n,c,l])=>{
          if(!n) return;
          pills.appendChild(div({style:{padding:'3px 8px',borderRadius:'12px',background:c+'20',border:'1px solid '+c+'40',fontSize:'9px',color:c}},n+' '+l));
        });
        pills.appendChild(span({style:{fontSize:'9px',color:'#333',marginLeft:'auto'}},rated.length+' rated sessions'));
        compBody.appendChild(pills);
      } else {
        compBody.appendChild(div({style:{fontSize:'10px',color:'#333'}},'Rate sessions (1-5) when logging to see compliance trends.'));
      }

    } catch(e){
      compBody.appendChild(div({style:{fontSize:'10px',color:'#555'}},'Compliance chart unavailable: '+e.message));
    }
  }

  [7,14,28].forEach(n=>{
    const b=btn({style:{padding:'4px 10px',borderRadius:'4px',fontSize:'10px',
      background:compRange===n?'var(--bg-tab-active)':'var(--bg-input)',
      border:'1px solid '+(compRange===n?'var(--border-btn)':'var(--border)'),
      color:compRange===n?'var(--text)':'var(--text-dim)'},
      onclick:()=>{
        compRange=n;
        compToggle.querySelectorAll('button').forEach((b2,i2)=>{
          const nn=[7,14,28][i2];
          b2.style.background=nn===n?'var(--bg-tab-active)':'var(--bg-input)';
          b2.style.borderColor=nn===n?'var(--border-btn)':'var(--border)';
          b2.style.color=nn===n?'var(--text)':'var(--text-dim)';
        });
        buildCompliance();
      }},n+'d');
    compToggle.appendChild(b);
  });
  compHdr.appendChild(compToggle);
  compCard.appendChild(compHdr);
  compCard.appendChild(div({style:{fontSize:'9px',color:'#555',marginBottom:'8px',lineHeight:'1.6'}},'Based on the Performance rating (1-5) logged per session. 3 = met plan (baseline).'));
  compCard.appendChild(compBody);
  buildCompliance();
  wrap.appendChild(compCard);
  // Recent log
  const entries=Object.entries(LOG).sort((a,b)=>a[0].localeCompare(b[0])).slice(-14);
  wrap.appendChild(div({class:'section-title'},'Recent Log'));
  if(!entries.length) wrap.appendChild(div({style:{fontSize:'11px',color:'#333'}},'No entries yet.'));
  entries.slice().reverse().forEach(([date,entry])=>{
    const dc=DC[entry.decision]||'#555';
    const row=div({class:'row-sep'});
    row.appendChild(span({style:{fontSize:'10px',color:'#444',minWidth:'80px'}},date));
    if(entry.hrv) row.appendChild(span({style:{fontSize:'10px',color:'#60a5fa'}},'HRV '+entry.hrv));
    if(entry.rhr) row.appendChild(span({style:{fontSize:'10px',color:'#a78bfa'}},'RHR '+entry.rhr));
    if(entry.decision) row.appendChild(span({style:{marginLeft:'auto',fontSize:'9px',color:dc,border:'1px solid '+dc+'40',padding:'2px 6px',borderRadius:'4px'}},entry.decision));
    wrap.appendChild(row);
  });

  return wrap;
}

// SETTINGS TAB
// ============================================================
function renderSettings(){
  const wrap=div({});
  let cfgForm={...CFG};

  // Appearance card
  const apCard=card([],{marginBottom:'16px',display:'flex',flexDirection:'column',gap:'10px'});
  apCard.appendChild(div({class:'section-title'},'Appearance'));

  hg.appendChild(div({},[lbl('HRV low (ms)'),hvlI]));
  hg.appendChild(div({},[lbl('HRV high (ms)'),hvhI]));

  const rg=div({class:'grid2'});
  const rlI=inp({class:'inp',type:'number',value:cfgForm.rhrLow});
  rlI.addEventListener('input',()=>cfgForm.rhrLow=parseFloat(rlI.value)||45);
  const rhI=inp({class:'inp',type:'number',value:cfgForm.rhrHigh});
  rhI.addEventListener('input',()=>cfgForm.rhrHigh=parseFloat(rhI.value)||50);
  rg.appendChild(div({},[lbl('RHR low (bpm)'),rlI]));
  rg.appendChild(div({},[lbl('RHR high (bpm)'),rhI]));
  cfgCard.appendChild(rg);

  // Block dates
  const dg=div({style:{display:'flex',flexDirection:'column',gap:'10px'}});

  bsI.addEventListener('input',()=>{cfgForm.blockStartStr=bsI.value;updateWeeksPreview();});
  const beI=inp({class:'inp',type:'date',value:cfgForm.blockEndStr||''});
  beI.addEventListener('input',()=>{cfgForm.blockEndStr=beI.value;updateWeeksPreview();});
  dg.appendChild(div({},[lbl('Block start'),bsI]));
  dg.appendChild(div({},[lbl('Block end (optional)'),beI]));
  cfgCard.appendChild(dg);

  const weeksInfo=div({style:{padding:'8px 10px',background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:'6px',fontSize:'10px',color:'#555'}},'');
  function updateWeeksPreview(){
    if(!validDateStr(cfgForm.blockStartStr)){weeksInfo.textContent='Set block start date';weeksInfo.style.color='#555';return;}
    const savedCFG={...CFG};
    Object.assign(CFG,cfgForm);
    const tw=totalWeeks(), bm=getBlockMonday(), be=getBlockEnd();
    Object.assign(CFG,savedCFG);
    weeksInfo.textContent=tw+' weeks · '+fmtDate(bm)+' to '+fmtDate(be);
    weeksInfo.style.color='#888';
  }
  updateWeeksPreview();
  cfgCard.appendChild(weeksInfo);

  const savCfgBtn=btn({class:'btn',onclick:()=>{
    if(!validDateStr(cfgForm.blockStartStr)){
      savCfgBtn.textContent='Invalid block start'; savCfgBtn.style.color='#ff6b6b';
      setTimeout(()=>{savCfgBtn.textContent='Save Config';savCfgBtn.style.color='';savCfgBtn.style.borderColor='';},2000);
      return;
    }
    CFG.hrvLow=cfgForm.hrvLow; CFG.hrvHigh=cfgForm.hrvHigh;
    CFG.rhrLow=cfgForm.rhrLow; CFG.rhrHigh=cfgForm.rhrHigh;
    CFG.blockStartStr=cfgForm.blockStartStr; CFG.blockEndStr=cfgForm.blockEndStr;
    S.set(SK.cfg,CFG);
    syncTargets();
    savCfgBtn.textContent='SAVED'; savCfgBtn.style.color='#00ff87'; savCfgBtn.style.borderColor='#00ff87';
    setTimeout(()=>render(),800);
  }},'Save Config');
  cfgCard.appendChild(savCfgBtn);
  wrap.appendChild(cfgCard);

  // ── Section 2: Races (auto-save on change, confirm on delete) ─
  const racesCard=card([],{marginBottom:'16px',display:'flex',flexDirection:'column',gap:'10px'});
  racesCard.appendChild(div({class:'section-title'},'Races'));

  if(!cfgForm.races){
    cfgForm.races=validDateStr(cfgForm.raceDateStr)?[{name:cfgForm.raceName||'Race',date:cfgForm.raceDateStr,dist:''}]:[];
  }

  function saveRaces(){
    const validRaces=(cfgForm.races||[]).filter(r=>r.name&&validDateStr(r.date));
    if(validRaces.length){
      const lastRace=validRaces[validRaces.length-1];
      CFG.raceDateStr=lastRace.date; CFG.raceName=lastRace.name;
    }
    CFG.races=cfgForm.races; S.set(SK.cfg,CFG);
    syncTargets();
    updateWeeksPreview();
  }

  const racesContainer=div({});
  function renderRacesEditor(){
    racesContainer.innerHTML='';
    if(!cfgForm.races||!cfgForm.races.length){
      cfgForm.races=[{name:'',date:'',dist:''}];
    }
    cfgForm.races.forEach((r,i)=>{
      const raceCard=div({style:{padding:'10px',background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:'7px',marginBottom:'8px'}});
      // Name
      const nameI=inp({class:'inp',type:'text',value:r.name,placeholder:'Race name'});
      nameI.addEventListener('input',()=>{cfgForm.races[i].name=nameI.value; saveRaces();});
      const nameWrap=div({style:{marginBottom:'8px'}});
      nameWrap.appendChild(lbl('Race name')); nameWrap.appendChild(nameI);
      raceCard.appendChild(nameWrap);
      // Date + dist + delete
      const row2=div({style:{display:'flex',gap:'8px',alignItems:'flex-end'}});
      const dateWrap=div({style:{flex:'1',minWidth:0}});
      dateWrap.appendChild(lbl('Date'));
      const dateI=inp({class:'inp',type:'date',value:r.date});
      dateI.addEventListener('input',()=>{cfgForm.races[i].date=dateI.value; saveRaces();});
      dateWrap.appendChild(dateI);
      row2.appendChild(dateWrap);
      const distWrap=div({style:{width:'80px',flexShrink:'0'}});
      distWrap.appendChild(lbl('Distance'));
      const distI=inp({class:'inp',type:'text',value:r.dist||'',placeholder:'50km'});
      distI.style.fontSize='12px';
      distI.addEventListener('input',()=>{cfgForm.races[i].dist=distI.value; saveRaces();});
      distWrap.appendChild(distI);
      row2.appendChild(distWrap);
      const delBtn=btn({style:{padding:'6px 9px',borderRadius:'5px',background:'#1a0a0a',border:'1px solid #2a1a1a',color:'#ff6b6b',fontSize:'13px',flexShrink:'0',alignSelf:'flex-end'},
        onclick:()=>{
          // Inline confirm -- replaces native confirm() which is blocked in some contexts

          if(existing){existing.remove();return;}
          const confirmRow=div({class:'race-del-confirm',style:{display:'flex',alignItems:'center',gap:'8px',marginTop:'8px',padding:'8px',background:'#1a0a0a',borderRadius:'5px',border:'1px solid #2a1a1a'}});
          confirmRow.appendChild(span({style:{fontSize:'10px',color:'#ff6b6b',flex:'1'}},'Remove '+(r.name||'this race')+'?'));
          confirmRow.appendChild(btn({style:{padding:'4px 10px',borderRadius:'4px',fontSize:'10px',background:'#ff6b6b',border:'none',color:'#000',fontWeight:'700'},
            onclick:()=>{cfgForm.races.splice(i,1); saveRaces(); renderRacesEditor();}},'Yes, remove'));
          confirmRow.appendChild(btn({style:{padding:'4px 10px',borderRadius:'4px',fontSize:'10px',background:'var(--bg-btn)',border:'1px solid var(--border)',color:'var(--text-mute)'},
            onclick:()=>confirmRow.remove()},'Cancel'));
          raceCard.appendChild(confirmRow);
        }},'\u00d7');
      row2.appendChild(delBtn);
      raceCard.appendChild(row2);
      racesContainer.appendChild(raceCard);
    });
    // Add race button
    racesContainer.appendChild(btn({style:{padding:'8px 12px',borderRadius:'5px',fontSize:'10px',background:'var(--bg-input)',border:'1px dashed var(--border-btn)',color:'var(--text-mute)',width:'100%'},
      onclick:()=>{
        if(!cfgForm.races) cfgForm.races=[];
        cfgForm.races.push({name:'',date:'',dist:''});
        saveRaces();
        renderRacesEditor();
      }},'+ Add race'));

  renderRacesEditor();
  racesCard.appendChild(racesContainer);
  wrap.appendChild(racesCard);

  // Backup card
  const bkCard=card([],{marginBottom:'16px',display:'flex',flexDirection:'column',gap:'10px'});
  bkCard.appendChild(div({class:'section-title'},'Data Backup'));
  bkCard.appendChild(btn({class:'btn',onclick:exportAll},'Export all data (JSON backup)'));

  const importInfo=div({style:{fontSize:'11px',color:'#555'}});
  const fileI=inp({type:'file',accept:'.json',style:{display:'none'}});
  fileI.addEventListener('change',()=>{
    const file=fileI.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const msg=importAll(ev.target.result);
      importInfo.textContent=msg;
      if(msg.includes('Reloading')) setTimeout(()=>location.reload(),1200);
    };
    reader.readAsText(file);
  });
  bkCard.appendChild(div({},[
    btn({class:'btn',onclick:()=>fileI.click()},'Import backup file'),
    fileI,
    importInfo,
  ]));
  wrap.appendChild(bkCard);
  const totalsCard=card([],{marginBottom:'16px',display:'flex',flexDirection:'column',gap:'10px'});
  totalsCard.appendChild(div({class:'section-title'},'Daily Totals -- Activity Types'));
  totalsCard.appendChild(div({style:{fontSize:'10px',color:'#555',lineHeight:'1.7'}},'Toggle which activity types contribute to daily km/vert/hr totals and weekly progress bars.'));
  const toggleGrid=div({style:{display:'flex',gap:'6px',flexWrap:'wrap'}});

  function groupActive(group){
    const ct=CFG.countTypes||[...DEFAULT_COUNT_TYPES];
    return group.types.some(t=>ct.includes(t));
  }
  function renderToggleBtns(){

      const active=groupActive(g);
      const b=btn({style:{padding:'6px 12px',borderRadius:'4px',fontSize:'10px',
        background:active?g.color+'25':'#0a0a18',border:'1px solid '+(active?g.color:'#2a2a4a'),
        color:active?g.color:'#444'},

          renderToggleBtns();

      toggleGrid.appendChild(b);
    });

  renderToggleBtns();
  totalsCard.appendChild(toggleGrid);
  wrap.appendChild(totalsCard);

  // CSV Plan Export / Import -- above TP iCal

function applySamplePlan(){
  const plan=getPlan();
  const newEdits={...EDITS};

  // Build date lookup
  const dateLookup={};
  plan.forEach((wk,wIdx)=>{
    wk.days.forEach((d,dIdx)=>{
      dateLookup[slotDate(wIdx,d.day)]={wIdx,dIdx};
    });
  });

  SAMPLE_SESSIONS.forEach(s=>{
    // Find the slot by week offset + day name
    const wIdx=s.wk-1;
    if(!plan[wIdx]) return;
    const dIdx=plan[wIdx].days.findIndex(d=>d.day===s.day);
    if(dIdx<0) return;
    const key='w'+wIdx+'-d'+dIdx;
    // Don't overwrite real edits (non-sample)
    if(newEdits[key] && !newEdits[key]._sample) return;
    newEdits[key]={label:s.label,type:s.type,detail:s.detail,km:s.km,vert:s.vert,hrs:s.hrs,_sample:true};
  });

  EDITS=newEdits;
  S.set(SK.edits,EDITS);
}

function clearSamplePlan(){
  const newEdits={};
  Object.entries(EDITS).forEach(([k,v])=>{
    if(!v._sample) newEdits[k]=v;
  });
  EDITS=newEdits;
  S.set(SK.edits,EDITS);
}

function hasSamplePlan(){
  return Object.values(EDITS).some(v=>v._sample);
}

  const body=div({style:{flex:'1',display:'flex',flexDirection:'column',maxWidth:'480px',margin:'0 auto',padding:'32px 24px 48px',width:'100%'}});

      // Race section
      const raceSect=div({style:{marginBottom:'24px'}});
      raceSect.appendChild(div({style:{fontSize:'11px',color:'#888',marginBottom:'10px',lineHeight:'1.6'}},'Your next race. Sets the countdown and block length. Add more races in Settings later.'));
      const raceGrid=div({style:{display:'flex',flexDirection:'column',gap:'10px'}});
      let raceName=CFG.races?.[0]?.name||'', raceDate=CFG.races?.[0]?.date||'', raceDist=CFG.races?.[0]?.dist||'';
      let blockStart=CFG.blockStartStr||new Date().toISOString().split('T')[0];
      const rni=inp({class:'inp',type:'text',value:raceName,placeholder:'UTMB 2026'});
      rni.addEventListener('input',()=>raceName=rni.value);
      const rdi=inp({class:'inp',type:'date',value:raceDate});
      rdi.addEventListener('input',()=>raceDate=rdi.value);
      const rdi2=inp({class:'inp',type:'text',value:raceDist,placeholder:'100km'});
      rdi2.addEventListener('input',()=>raceDist=rdi2.value);
      const bsi=inp({class:'inp',type:'date',value:blockStart});
      bsi.addEventListener('input',()=>blockStart=bsi.value);
      raceGrid.appendChild(div({},[lbl('Race name'),rni]));
      const rdRow=div({class:'grid2'});
      rdRow.appendChild(div({},[lbl('Race date'),rdi]));
      rdRow.appendChild(div({},[lbl('Distance'),rdi2]));
      raceGrid.appendChild(rdRow);
      raceGrid.appendChild(div({},[lbl('Training block start'),bsi]));
      raceGrid.appendChild(div({style:{fontSize:'9px',color:'#333'}},'Block start is the Monday your training begins. Weeks are calculated from there.'));
      raceSect.appendChild(raceGrid);
      body.appendChild(raceSect);

      const errMsg=div({style:{fontSize:'11px',color:'#ff6b6b',marginBottom:'10px',minHeight:'16px'}});
      body.appendChild(errMsg);

      body.appendChild(btn({class:'btn btn-ok',onclick:()=>{
        if(!raceName.trim()){ errMsg.textContent='Enter a race name.'; return; }
        if(!validDateStr(raceDate)){ errMsg.textContent='Enter a valid race date.'; return; }
        if(!validDateStr(blockStart)){ errMsg.textContent='Enter a valid block start date.'; return; }
        // Apply to CFG
        CFG.hrvLow=hrvLow; CFG.hrvHigh=hrvHigh;
        CFG.rhrLow=rhrLow; CFG.rhrHigh=rhrHigh;
        CFG.blockStartStr=blockStart;
        CFG.raceDateStr=raceDate; CFG.raceName=raceName;
        CFG.races=[{name:raceName,date:raceDate,dist:raceDist}];
        S.set(SK.cfg,CFG);
        syncTargets();
        if(Object.keys(EDITS).length===0) applySamplePlan();
        markOnboarded();
        overlay.remove();
        render();
      }},'Start training ->'));

      body.appendChild(btn({style:{padding:'10px',background:'transparent',border:'none',color:'#333',fontSize:'11px',marginTop:'8px',width:'100%'},
        onclick:()=>{markOnboarded();overlay.remove();render();}},'Skip for now'));
    }
  }

  renderStep();
}

// ============================================================
// BOOT
// ============================================================
applyStravaBackfill();
// Apply sample plan on first load (no existing edits)
if(Object.keys(EDITS).length===0) applySamplePlan();
if(isFirstRun()){
  render();
  showOnboarding();
} else {
  render();
}
setInterval(()=>{ renderHeader(); }, 60000);
</script>
</body>
</html>
