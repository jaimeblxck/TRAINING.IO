<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training OS">
<title>Training OS</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07071a; --bg-card:#0a0a1a; --bg-input:#0e0e1f; --bg-elev:#0d0d1f;
  --bg-btn:#1a1a3a; --bg-tab-active:#1a1a3a; --bg-modal:#0d0d1f;
  --border:#1c1c2e; --border-input:#22223a; --border-btn:#3a3a6a; --border-subtle:#1a1a2e;
  --text:#e0e0ff; --text-mute:#4a4a6a; --text-dim:#444; --text-faint:#333;
  --track:#1a1a2e;
}
body.light{
  --bg:#f4f4f8; --bg-card:#ffffff; --bg-input:#ffffff; --bg-elev:#ffffff;
  --bg-btn:#e8e8f4; --bg-tab-active:#dcdcf0; --bg-modal:#ffffff;
  --border:#d8d8e4; --border-input:#c8c8d8; --border-btn:#b0b0d0; --border-subtle:#e4e4ec;
  --text:#1a1a2e; --text-mute:#7a7a90; --text-dim:#999; --text-faint:#aaa;
  --track:#e0e0e8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;min-height:100vh;font-size:13px;transition:background 0.3s,color 0.3s;}
input,select,textarea,button{font-family:'JetBrains Mono',monospace;font-size:12px;}
input[type=date].inp{font-size:12px;padding:7px 8px;height:36px;-webkit-appearance:none;appearance:none;min-width:0;width:100%;}
input[type=date]::-webkit-date-and-time-value{text-align:left;}
input[type=number]{-moz-appearance:textfield;}
select option{background:var(--bg-input);color:var(--text);}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border);}
#app{max-width:480px;margin:0 auto;padding-bottom:60px;}
.pad{padding:0 20px;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.lbl{font-size:9px;color:var(--text-mute);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:4px;display:block;}
.inp{background:var(--bg-input);border:1px solid var(--border-input);color:var(--text);padding:8px 10px;border-radius:6px;outline:none;width:100%;}
.sel{background:var(--bg-input);border:1px solid var(--border-input);color:var(--text);padding:7px 8px;border-radius:5px;outline:none;width:100%;cursor:pointer;}
.btn{padding:10px 14px;border-radius:7px;border:1px solid var(--border-btn);background:var(--bg-btn);color:var(--text);cursor:pointer;letter-spacing:0.08em;width:100%;display:block;text-align:center;}
.btn-sm{padding:7px 12px;border-radius:5px;border:1px solid var(--border-btn);background:var(--bg-btn);color:var(--text);cursor:pointer;font-size:10px;}
.btn-ok{border-color:#00ff8750;background:#00ff8720;color:#00b894;}
.btn-danger{border-color:#3a1a1a;background:#1a0a0a;color:#ff6b6b;}
.btn-ghost{border-color:var(--border-subtle);background:var(--bg-btn);color:var(--text-mute);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.flex{display:flex;align-items:center;gap:8px;}
.tab-bar{display:flex;margin:16px 20px;background:var(--bg-card);border-radius:8px;padding:3px;border:1px solid var(--border-subtle);}
.tab{flex:1;padding:8px 0;background:transparent;border:none;color:var(--text-dim);border-radius:6px;cursor:pointer;font-size:10px;letter-spacing:0.06em;transition:all 0.2s;}
.tab.active{background:var(--bg-tab-active);color:var(--text);}
.pbar-track{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:2px;position:relative;}
.pbar-fill{height:100%;border-radius:3px;transition:width 0.4s;}
body.light .pbar-track{background:transparent;overflow:visible;}
body.light .pbar-track::before{content:'';position:absolute;inset:0;border-radius:3px;border:1.5px solid var(--pbar-color,#888);opacity:0.3;}
body.light .pbar-fill{opacity:0.6;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{width:100%;max-width:480px;background:var(--bg-modal);border-radius:16px 16px 0 0;border:1px solid var(--border);border-bottom:none;padding:20px 20px 44px;max-height:90vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--border-input);border-radius:2px;margin:0 auto 18px;}
.session-row{width:100%;text-align:left;padding:10px 12px;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--border);background:var(--bg-card);}
.badge{font-size:9px;color:#000;padding:2px 5px;border-radius:3px;font-weight:700;min-width:34px;text-align:center;}
.hint{font-size:9px;margin-top:3px;}
.divider{border:none;border-top:1px solid var(--border-subtle);margin:16px 0;}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
.ring-lbl{font-size:9px;color:var(--text-mute);letter-spacing:0.14em;text-transform:uppercase;}
.week-btn{padding:4px 9px;border-radius:4px;font-size:11px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-dim);cursor:pointer;}
.week-btn.active{font-weight:700;}
.coach-box{padding:12px;background:#0a1a0a;border:1px solid #00ff8730;border-radius:8px;}
.section-title{font-size:9px;color:#4a4a6a;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:12px;}
.row-sep{padding:8px 0;border-bottom:1px solid #111;display:flex;align-items:center;gap:10px;}
</style>
</head>
<body>
<div id="app">
  <div id="header" style="padding:20px 20px 0;margin-bottom:16px;"></div>
  <div class="tab-bar" id="tabs"></div>
  <div class="pad" id="content"></div>
</div>

<script>
// ============================================================
// DATA & CONFIG
// ============================================================
const SK = {cfg:'utmb_cfg_v1',log:'utmb_log_v1',edits:'utmb_edits_v2',targets:'utmb_targets_v1',runs:'utmb_runs_v3'};
const WTC = {BUILD:'#ffd166',PEAK:'#ff6b35',SHARPEN:'#ff9f43',TAPER:'#a29bfe',RACE:'#fd79a8',DELOAD:'#74b9ff',RECOVERY:'#55efc4'};
const TC = {strength:'#7b9cff',intervals:'#ff9f43',easy:'#55efc4',long:'#a29bfe',race:'#fd79a8',ride:'#06b6d4',walk:'#94a3b8',sauna:'#fb923c',other:'#636e72',rest:'#3a3a4a'};
const TL = {strength:'STR',intervals:'INT',easy:'EASY',long:'LONG',race:'RACE',ride:'RIDE',walk:'WALK',sauna:'SAUNA',other:'OTHER',rest:'REST'};
// For display/toggle: run types consolidated, rest removed, ride added
const ALL_TYPES = ['strength','intervals','easy','long','race','ride','walk','sauna','other','rest'];
// Count types use 'run' as a meta-group (intervals+easy+long+race) plus strength and ride
const COUNT_TOGGLE_GROUPS = [
  {id:'run',   label:'RUN',      color:'#a29bfe', types:['intervals','easy','long','race']},
  {id:'strength',label:'STR',   color:'#7b9cff', types:['strength']},
  {id:'ride',  label:'RIDE',     color:'#06b6d4', types:['ride']},
  {id:'walk',  label:'WALK',     color:'#94a3b8', types:['walk']},
  {id:'sauna', label:'SAUNA',    color:'#fb923c', types:['sauna']},
  {id:'other', label:'OTHER',    color:'#636e72', types:['other']},
];
const DEFAULT_COUNT_TYPES = ['intervals','easy','long','race','strength'];
const WEEK_TYPES = ['BUILD','PEAK','SHARPEN','TAPER','RACE','DELOAD','RECOVERY'];

const DEF_CFG = {
  hrvLow:45, hrvHigh:70, rhrLow:45, rhrHigh:50,
  blockStartStr:'2026-06-06',
  blockEndStr:'2026-09-01',   // Sunday on or after last race -- controls block length
  raceDateStr:'2026-08-28',   // kept for backward compat -- mirrors races[0].date
  raceName:'UTMB 2026',       // kept for backward compat -- mirrors races[0].name
  races:[
    {name:'Woodford to Glenbrook',  date:'2026-06-21', dist:'25km'},
    {name:'UTMB 2026',              date:'2026-08-28', dist:'171km'},
  ],
  countTypes:DEFAULT_COUNT_TYPES,
  theme:'dark',
};

// BASE_PLAN: empty day slots. Sessions only populate from TP iCal import or manual edits.
const DAYS_OF_WEEK=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function makeEmptyWeek(wNum){
  return {week:wNum,days:DAYS_OF_WEEK.map(day=>({day,label:'',type:'rest',detail:'',km:0,vert:0,hrs:0}))};
}
const BASE_PLAN=Array.from({length:12},(_,i)=>makeEmptyWeek(i+1));
// Default targets -- match the 4-week sample plan structure.
// These expand to totalWeeks() when block is longer than 4 weeks.
const DEF_TARGETS = [
  {week:1, type:'RECOVERY', km:70,  vert:2100, hrs:11},
  {week:2, type:'BUILD',    km:95,  vert:3500, hrs:13.5},
  {week:3, type:'SHARPEN',  km:80,  vert:2500, hrs:11.5},
  {week:4, type:'RACE',     km:30,  vert:500,  hrs:4},
  // Extended block defaults (weeks 5+)
  {week:5, type:'BUILD',    km:97,  vert:4000, hrs:13},
  {week:6, type:'BUILD',    km:102, vert:4500, hrs:14},
  {week:7, type:'BUILD',    km:102, vert:5000, hrs:15},
  {week:8, type:'PEAK',     km:107, vert:5500, hrs:16},
  {week:9, type:'PEAK',     km:110, vert:5800, hrs:16},
  {week:10,type:'SHARPEN',  km:95,  vert:5000, hrs:14},
  {week:11,type:'TAPER',    km:70,  vert:3000, hrs:10},
  {week:12,type:'TAPER',    km:45,  vert:1500, hrs:6},
  {week:13,type:'RACE',     km:30,  vert:500,  hrs:4},
];

// ============================================================
// STORAGE
// ============================================================
const S = {
  get(k,fb){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):fb;}catch{return fb;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};

// ============================================================
// STATE
// ============================================================
let CFG = S.get(SK.cfg, DEF_CFG);
let LOG = S.get(SK.log, {});
let EDITS = S.get(SK.edits, {});
let TARGETS = S.get(SK.targets, null) || buildTargets();
let RUNS = S.get(SK.runs, {});
let ACTIVE_TAB = 'today';
let EXPANDED_DAY = null;
let EDITING_DAY = null;
let EDIT_WEEK = null;
let BLOCK_EDITING = null;

function save(key, val){ S.set(key,val); }

// ============================================================
// HELPERS
// ============================================================
// Always use local date string to avoid UTC timezone shift (critical for AEST +10)
// Format hours as h:mm for activity display (e.g. 1.5 -> "1:30")
function fmtHms(hrs){
  if(!hrs||isNaN(hrs)||hrs<=0) return '';
  const h=Math.floor(hrs);
  const m=Math.round((hrs-h)*60);
  return h+':'+(m<10?'0':'')+m;
}
// Parse h:mm or decimal hours input -> decimal hours
function parseHms(val){
  if(!val||val==='') return '';
  const s=String(val).trim();
  if(s.includes(':')){
    const [h,m]=s.split(':');
    const hrs=parseInt(h)||0;
    const mins=parseInt(m)||0;
    return hrs+mins/60;
  }
  return parseFloat(s)||0;
}
// Format hours as x.x for totals (e.g. 3.5 -> "3.5hr")
function fmtHrTot(hrs){
  if(!hrs||isNaN(hrs)||hrs<=0) return '0hr';
  return parseFloat(hrs).toFixed(1)+'hr';
}
// Always use local date string to avoid UTC timezone shift
function localDateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const dy=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dy;
}
function today(){ return localDateStr(new Date()); }

// Validate a date string -- returns true only for complete YYYY-MM-DD
function validDateStr(s){
  if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d=new Date(s+'T00:00:00');
  return !isNaN(d.getTime());
}

// Find the Monday on or before a given date -- true week anchor
function getBlockMonday(){
  const str=validDateStr(CFG.blockStartStr)?CFG.blockStartStr:'2026-06-06';
  const bs=new Date(str+'T00:00:00');
  bs.setHours(0,0,0,0);
  const dow=bs.getDay();
  const daysBack=dow===0?6:dow-1;
  bs.setDate(bs.getDate()-daysBack);
  return bs;
}

function totalWeeks(){
  const mon=getBlockMonday();
  const end=getBlockEnd();
  const tw=Math.ceil((end-mon)/(7*86400000));
  return Math.max(1,Math.min(52,isNaN(tw)?12:tw)); // cap at 52 weeks
}

function curWeek(){
  const mon=getBlockMonday();
  const now=new Date(); now.setHours(0,0,0,0);
  const w=Math.floor((now-mon)/(7*86400000))+1;
  const tw=totalWeeks();
  return Math.max(1,Math.min(tw,isNaN(w)?1:w));
}

// Returns {mon, sun} Date objects for a given week index (0-based)
function weekDates(wIdx){
  const anchor=getBlockMonday();
  const mon=new Date(anchor);
  mon.setDate(anchor.getDate()+(wIdx||0)*7);
  const sun=new Date(mon);
  sun.setDate(mon.getDate()+6);
  return {mon,sun};
}

// Format a Date as "6 Jun" or "28 Aug"
function fmtDate(d){
  if(!d||isNaN(d.getTime())) return '?';
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate()+' '+months[d.getMonth()];
}

// Format today's date as "Mon 7 Jun 2026"
function fmtToday(){
  const d=new Date();
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}

// Get the actual calendar date string (YYYY-MM-DD) for a plan slot -- uses local time
function slotDate(wIdx, dayName){
  const {mon}=weekDates(wIdx);
  const targetDow={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[dayName]??0;
  const d=new Date(mon);
  d.setDate(mon.getDate()+targetDow);
  return localDateStr(d);
}
// Same but returns a Date object (for fmtDate display)
function slotDateObj(wIdx, dayName){
  const {mon}=weekDates(wIdx);
  const targetDow={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[dayName]??0;
  const d=new Date(mon);
  d.setDate(mon.getDate()+targetDow);
  return d;
}

// Returns races array, merging legacy raceDateStr for old saved configs
function getRaces(){
  const races=CFG.races&&CFG.races.length?CFG.races:[];
  if(!races.length&&validDateStr(CFG.raceDateStr)){
    return [{name:CFG.raceName||'Race',date:CFG.raceDateStr,dist:''}];
  }
  return races.filter(r=>validDateStr(r.date)).sort((a,b)=>a.date.localeCompare(b.date));
}
// Next upcoming race (today counts)
function getNextRace(){
  const td=today();
  const upcoming=getRaces().filter(r=>r.date>=td);
  return upcoming[0]||getRaces().slice(-1)[0]||null;
}
// Days to a specific date string
function daysTo(dateStr){
  if(!validDateStr(dateStr)) return null;
  const rd=new Date(dateStr+'T00:00:00');
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.max(0,Math.ceil((rd-now)/86400000));
}
function daysToRace(){
  const r=getNextRace();
  return r?daysTo(r.date):null;
}
// Last Sunday on or after the block end / last race
function getBlockEnd(){
  // Prefer explicit blockEndStr, else derive from last race
  let endStr=validDateStr(CFG.blockEndStr)?CFG.blockEndStr:null;
  if(!endStr){
    const races=getRaces();
    endStr=races.length?races[races.length-1].date:(validDateStr(CFG.raceDateStr)?CFG.raceDateStr:'2026-08-28');
  }
  const rd=new Date(endStr+'T00:00:00'); rd.setHours(0,0,0,0);
  const dow=rd.getDay();
  rd.setDate(rd.getDate()+(dow===0?0:7-dow));
  return rd;
}

function getPlan(){
  const tw=totalWeeks();
  const out=[];
  for(let i=0;i<tw;i++){
    out.push(BASE_PLAN[i]||{...BASE_PLAN[Math.min(6,BASE_PLAN.length-1)],week:i+1});
  }
  return out;
}

function buildTargets(){
  const tw=totalWeeks();
  const out=[];
  for(let i=0;i<tw;i++){
    out.push(DEF_TARGETS[i]||{week:i+1,type:'BUILD',km:100,vert:4500,hrs:14});
  }
  return out;
}

// Ensure TARGETS always matches current totalWeeks -- trims or extends as needed
function syncTargets(){
  const tw=totalWeeks();
  if(TARGETS.length===tw) return;
  if(TARGETS.length>tw){
    TARGETS=TARGETS.slice(0,tw);
  } else {
    for(let i=TARGETS.length;i<tw;i++){
      TARGETS.push(DEF_TARGETS[i]||{week:i+1,type:'BUILD',km:100,vert:4500,hrs:14});
    }
  }
  S.set(SK.targets,TARGETS);
}

function getSession(wIdx,dIdx){
  const plan=getPlan();
  const base=plan[wIdx]&&plan[wIdx].days[dIdx];
  if(!base) return null;
  return Object.assign({},base,EDITS['w'+wIdx+'-d'+dIdx]||{});
}
// Returns array of activities for a day (always an array, never null)
function getDayActivities(wIdx,dIdx){
  const v=RUNS['w'+wIdx+'-d'+dIdx];
  if(!v) return [];
  // Migrate legacy single-object format to array
  if(!Array.isArray(v)) return [v];
  return v;
}
// Save activities array for a day
function saveDayActivities(wIdx,dIdx,activities){
  RUNS['w'+wIdx+'-d'+dIdx]=activities;
  S.set(SK.runs,RUNS);
}
// Compat shim -- returns first completed activity (for fatigue/RPE lookups)
function getRunLog(wIdx,dIdx){
  const acts=getDayActivities(wIdx,dIdx);
  return acts.find(a=>a.completed)||acts[0]||null;
}
// Sum km/vert/hrs across activities whose type is in CFG.countTypes
function getDayTotals(wIdx,dIdx){
  const countTypes=CFG.countTypes||DEFAULT_COUNT_TYPES;
  return getDayActivities(wIdx,dIdx)
    .filter(a=>a.completed && countTypes.includes(a.type||'easy'))
    .reduce((acc,a)=>{
      acc.km+=parseFloat(a.actualKm||0);
      acc.vert+=parseFloat(a.actualVert||0);
      acc.hrs+=parseFloat(a.actualHrs||0);
      return acc;
    },{km:0,vert:0,hrs:0});
}
// Get the effective km/vert/hrs for an activity -- actual if logged, planned if not
function actEffective(a){
  const pf=v=>{ const n=parseFloat(v); return isNaN(n)?0:n; };
  if(a.completed){
    return {km:pf(a.actualKm), vert:pf(a.actualVert), hrs:pf(a.actualHrs)};
  }
  // Unlogged: planned fields (TP import) take priority, then any pre-filled actuals
  return {
    km:  pf(a.planned?.km)  || pf(a.actualKm),
    vert:pf(a.planned?.vert)|| pf(a.actualVert),
    hrs: pf(a.planned?.hrs) || pf(a.actualHrs),
  };
}

// Sum effective metrics across all activities for a day (for display -- all types)
function getDayPlanned(wIdx,dIdx,filterByCountTypes=false){
  const acts=getDayActivities(wIdx,dIdx);
  // If no activities at all, day is empty — no planned metrics
  if(acts.length===0) return {km:0,vert:0,hrs:0};

  const countTypes=CFG.countTypes||DEFAULT_COUNT_TYPES;
  const eligible=filterByCountTypes
    ?acts.filter(a=>countTypes.includes(a.type||'easy'))
    :acts;

  if(eligible.length>0){
    const result=eligible.reduce((acc,a)=>{
      const e=actEffective(a);
      acc.km+=e.km; acc.vert+=e.vert; acc.hrs+=e.hrs;
      return acc;
    },{km:0,vert:0,hrs:0});
    if(result.km>0||result.hrs>0) return result;
  }

  // Activities exist but all return zero effective values
  // Fall back to EDITS slot only if activities exist (not empty day)
  const s=getSession(wIdx,dIdx);
  const sk=parseFloat(s?.km)||0, sv=parseFloat(s?.vert)||0, sh=parseFloat(s?.hrs)||0;
  if(sk>0||sh>0) return {km:sk,vert:sv,hrs:sh};

  if(filterByCountTypes&&acts.length>0){
    const r2=acts.reduce((acc,a)=>{
      const e=actEffective(a);
      acc.km+=e.km; acc.vert+=e.vert; acc.hrs+=e.hrs;
      return acc;
    },{km:0,vert:0,hrs:0});
    if(r2.km>0||r2.hrs>0) return r2;
  }

  return {km:0,vert:0,hrs:0};
}
// Is any activity on this day completed?
function isDayDone(wIdx,dIdx){
  const acts=getDayActivities(wIdx,dIdx);
  return acts.length>0 && acts.every(a=>a.completed);
}
// Generate a unique id for a new activity
function newActId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function dowIndex(day){ return {Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:0}[day]??-1; }

function scoreHRV(v){
  const n=parseFloat(v); if(isNaN(n)) return null;
  const lo=CFG.hrvLow, hi=CFG.hrvHigh;
  if(n>=lo&&n<=hi) return 60+((n-lo)/(hi-lo))*20;
  if(n>hi) return Math.min(100,80+((n-hi)/10)*20);
  return Math.max(0,40-((lo-n)/15)*40);
}
function scoreRHR(v){
  const n=parseFloat(v); if(isNaN(n)) return null;
  const lo=CFG.rhrLow, hi=CFG.rhrHigh;
  if(n<=lo) return 90;
  if(n<=hi) return 70-((n-lo)/(hi-lo))*20;
  return Math.max(0,50-((n-hi)/10)*30);
}
function scoreSleep(v){ return !v?null:v==='great'?90:v==='ok'?60:25; }
function scoreSub(legs,mood,mot){
  const vals=[legs,mood,mot].filter(x=>x!=='').map(Number);
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length/5*100);
}
// 7-day weighted fatigue load -- more recent days weighted more heavily
// RPE/perf scores cast a recovery shadow that decays over days
function getFatigueLoad(){
  const weights=[1.0,0.85,0.7,0.55,0.4,0.28,0.15]; // today-1 to today-7
  let totalLoad=0, totalWeight=0;
  const plan=getPlan();
  for(let daysAgo=1;daysAgo<=7;daysAgo++){
    const d=new Date(); d.setDate(d.getDate()-daysAgo); d.setHours(0,0,0,0);
    const dateStr=localDateStr(d);
    const w=weights[daysAgo-1];
    // Check daily log RPE first
    const logEntry=LOG[dateStr];
    if(logEntry?.rpe){
      const rpeVal=parseInt(logEntry.rpe);
      totalLoad+=rpeVal*w; totalWeight+=w;
      continue;
    }
    // Fall back to run log perf for that date
    const diffDays=Math.floor((d-getBlockMonday())/(86400000));    if(diffDays>=0){
      const wIdx=Math.floor(diffDays/7);
      const dow=d.getDay();
      if(plan[wIdx]){
        const dIdx=plan[wIdx].days.findIndex(s=>dowIndex(s.day)===dow);
        if(dIdx>=0){
          const rl=getRunLog(wIdx,dIdx);
          if(rl?.perf){ totalLoad+=parseInt(rl.perf)*w; totalWeight+=w; }
        }
      }
    }
  }
  if(!totalWeight) return null;
  return totalLoad/totalWeight; // 1-5 scale
}

function getDecision(combined){
  if(combined>=74) return {label:'GO HARD',short:'up',color:'#00c96e',textColor:'#007a42',desc:'All signals green. Execute as planned or push harder.'};
  if(combined>=55) return {label:'AS PLANNED',short:'right',color:'#a8d800',textColor:'#5a7a00',desc:'Solid baseline. Stick to the plan.'};
  if(combined>=38) return {label:'MODIFY',short:'wave',color:'#ffd166',textColor:'#b07a00',desc:'Mixed signals. Cut intensity or volume ~20%.'};
  return {label:'BACK OFF',short:'down',color:'#ff6b6b',textColor:'#c0202a',desc:'Non-negotiable. Easy movement or full rest only.'};
}

function parseICS(text){
  const events=[];
  const blocks=text.split('BEGIN:VEVENT');
  for(let i=1;i<blocks.length;i++){
    const block=blocks[i];
    const get=key=>{
      const re=new RegExp(key+'[^:]*:([^\r\n]+)');
      const m=block.match(re);
      return m?m[1].trim():null;
    };
    const dtstart=get('DTSTART');
    const summary=get('SUMMARY');
    const description=get('DESCRIPTION')||'';
    if(!dtstart||!summary) continue;
    // Strip everything after T to get just YYYYMMDD regardless of format
    const ds=dtstart.replace(/[^0-9]/g,'').slice(0,8);
    if(ds.length<8) continue;
    const year=parseInt(ds.slice(0,4));
    const month=parseInt(ds.slice(4,6))-1;
    const day=parseInt(ds.slice(6,8));
    // Use local date constructor to avoid UTC offset shifting the day
    const date=new Date(year,month,day,12,0,0);
    const dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    events.push({
      date,
      dateStr,
      summary:summary.replace(/\\n/g,' ').replace(/\\,/g,',').trim(),
      description:description.replace(/\\n/g,' ').replace(/\\,/g,',').trim(),
    });
  }
  return events.sort((a,b)=>a.date-b.date);
}
function guessTypeFromSummary(s){
  const t=s.toLowerCase();
  if(t.includes('race')||t.includes('utmb')||t.includes('utk')||t.includes('time trial')) return 'race';
  if(t.includes('rest')||t.includes('day off')||t.includes('travel')) return 'rest';
  if(t.includes('ride')||t.includes('cycling')||t.includes('bike')||t.includes('cycle')) return 'ride';
  if(t.includes('walk')||t.includes('hike')) return 'walk';
  if(t.includes('sauna')||t.includes('heat')) return 'sauna';
  if(t.includes('strength')||t.includes('gym')||t.includes('squat')||t.includes('upper')||t.includes('lower')||t.includes('weights')||t.includes('lifting')) return 'strength';
  if(t.includes('interval')||t.includes('sprint')||t.includes('rep')||t.includes('threshold')||t.includes('vo2')||t.includes('tempo')||t.includes('fartlek')) return 'intervals';
  // long/climb handled by km threshold after parsing
  return 'easy';
}
// Apply km-based type upgrade: >20km = long, unless already race/intervals/strength/ride
function autoUpgradeType(type, km){
  if(['race','intervals','strength','ride','sauna','walk','other'].includes(type)) return type;
  if(km>=20) return 'long';
  if(km>=15 && type==='easy') return 'long';
  return type;
}
function parseTPDescription(desc){
  // Unescape literal \n sequences from iCal
  const d = desc.replace(/\\n/g,'\n').replace(/\\,/g,',');
  const result = {};

  // Planned Time: H:MM or HH:MM
  const pt = d.match(/Planned Time:\s*(\d+):(\d+)/);
  if(pt) result.hrs = Math.round((parseInt(pt[1]) + parseInt(pt[2])/60) * 100) / 100;

  // Distance Planned: X km
  const dp = d.match(/Distance Planned:\s*([\d.]+)\s*km/i);
  if(dp) result.km = parseFloat(dp[1]);

  // Workout type (used for type inference)
  const wt = d.match(/Workout type:\s*([^\n]+)/);
  if(wt) result.workoutType = wt[1].trim();

  return result;
}
function applyICSToEdits(icsText){
  const events=parseICS(icsText);
  if(!events.length) return {ok:false,msg:'No events found in calendar data.'};
  const plan=getPlan();

  // Build date lookup using Monday-anchored slotDate() - returns local date string
  const dateLookup={};
  plan.forEach((wk,wIdx)=>{
    wk.days.forEach((d,dIdx)=>{
      const dateStr=slotDate(wIdx,d.day);
      dateLookup[dateStr]={wIdx,dIdx};
    });
  });

  // Group events by date
  const byDate={};
  events.forEach(ev=>{
    if(!byDate[ev.dateStr]) byDate[ev.dateStr]=[];
    byDate[ev.dateStr].push(ev);
  });

  let matched=0, skipped=0;
  const newEdits={...EDITS};

  Object.entries(byDate).forEach(([dateStr,evs])=>{
    const slot=dateLookup[dateStr];
    if(!slot){skipped+=evs.length;return;}
    const {wIdx,dIdx}=slot;
    const base=plan[wIdx].days[dIdx];
    const key='w'+wIdx+'-d'+dIdx;

    // Filter obvious non-training
    const skipWords=['sauna','walk','walking','rest','day off'];
    const training=evs.filter(e=>!skipWords.some(s=>e.summary.toLowerCase().includes(s)));
    const nonTraining=evs.filter(e=>skipWords.some(s=>e.summary.toLowerCase().includes(s)));
    const use=training.length?training:evs;

    // Parse metrics for each event
    const parsed=use.map(ev=>{
      const m=parseTPDescription(ev.description||'');
      const t=guessTypeFromSummary(ev.summary);
      const km=m.km!=null?m.km:0;
      return {
        label:ev.summary,
        type:autoUpgradeType(t,km),
        detail:(ev.description||'').replace(/Workout type:[^\n]*\n?/,'').replace(/Actual[^\n]*\n?/g,'').trim()||'',
        km, vert:0, hrs:m.hrs!=null?m.hrs:0,
      };
    });

    // Plan edit: use primary event for label/type, sum metrics
    const primary=parsed[0];
    const totalKm=parsed.reduce((s,p)=>s+p.km,0);
    const totalHrs=parsed.reduce((s,p)=>s+p.hrs,0);
    // If multiple types, pick the dominant one (longest session by hrs)
    const dominant=parsed.reduce((a,b)=>b.hrs>a.hrs?b:a);

    newEdits[key]={
      label:parsed.length>1
        ? parsed.map(p=>p.label).join(' + ')
        : primary.label,
      type:dominant.type,
      detail:primary.detail,
      km:Math.round(totalKm*10)/10,
      vert:base.vert,
      hrs:Math.round(totalHrs*100)/100,
    };

    // Store ALL events as pre-planned (incomplete) activities in RUNS
    // This is the source of truth for what shows in the plan day view
    const existing=RUNS[key]||[];
    const existingLabels=new Set(existing.map(a=>a.label));

    const toAdd=[...parsed,...nonTraining.map(ev=>{
      const t=guessTypeFromSummary(ev.summary);
      return {label:ev.summary,type:t,detail:'',km:0,vert:0,hrs:0};
    })].filter(p=>!existingLabels.has(p.label)).map(p=>({
      id:newActId(),
      label:p.label,
      type:p.type,
      detail:p.detail,
      actualKm:'', actualVert:'', actualHrs:'',
      perf:'', exec:'', note:'',
      completed:false,
      ts:Date.now(),
      planned:{km:p.km, hrs:p.hrs},
    }));

    if(toAdd.length) RUNS[key]=[...existing,...toAdd];
    matched++;
  });

  EDITS=newEdits; S.set(SK.edits,EDITS);
  S.set(SK.runs,RUNS);

  const msg=matched+' days matched to plan.'+(skipped?' '+skipped+' events outside block range.':'');
  return {ok:true,msg};
}

function el(tag,attrs,children){
  const e = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(k=>{
    if(k==='style'&&typeof attrs[k]==='object'){ Object.assign(e.style,attrs[k]); }
    else if(k==='class'){ e.className=attrs[k]; }
    else if(k.startsWith('on')){ e.addEventListener(k.slice(2).toLowerCase(),attrs[k]); }
    else { e.setAttribute(k,attrs[k]); }
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null||c===false) return;
      e.appendChild(typeof c==='string'?document.createTextNode(c):c);
    });
  }
  return e;
}
function div(attrs,children){ return el('div',attrs,children); }
function span(attrs,children){ return el('span',attrs,children); }
function btn(attrs,children){ return el('button',attrs,children); }
function inp(attrs){ return el('input',attrs); }
function sel(attrs,opts,val){
  const s=el('select',attrs);
  s.appendChild(el('option',{value:''},'--'));
  opts.forEach(o=>{ const op=el('option',{value:o.v},o.l); if(o.v===val) op.selected=true; s.appendChild(op); });
  return s;
}
function lbl(text){ return el('label',{class:'lbl'},text); }
function card(children,extraStyle={}){
  const c=div({class:'card'},children);
  Object.assign(c.style,extraStyle);
  return c;
}
function pbar(value,max,color='#b8ff4f'){
  const pct=max>0?Math.min(100,(value/max)*100):0;
  const barColor=value>max&&max>0?'#e84040':color;
  const fill=div({class:'pbar-fill',style:{width:pct+'%',background:barColor}});
  const track=div({class:'pbar-track'},[fill]);
  track.style.setProperty('--pbar-color',barColor);
  return track;
}
function ring(value,color,label,size=76,textColor){
  const r=size/2-7, circ=2*Math.PI*r;
  const pct=value!=null?Math.max(0,Math.min(100,value))/100:0;
  const fill=pct*circ;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',size); svg.setAttribute('height',size);
  const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
  bg.setAttribute('cx',size/2); bg.setAttribute('cy',size/2); bg.setAttribute('r',r);
  bg.setAttribute('fill','none'); bg.setAttribute('stroke','#1c1c2e'); bg.setAttribute('stroke-width','5.5');
  svg.appendChild(bg);
  if(value!=null){
    const arc=document.createElementNS('http://www.w3.org/2000/svg','circle');
    arc.setAttribute('cx',size/2); arc.setAttribute('cy',size/2); arc.setAttribute('r',r);
    arc.setAttribute('fill','none'); arc.setAttribute('stroke',color); arc.setAttribute('stroke-width','5.5');
    arc.setAttribute('stroke-dasharray',fill+' '+circ); arc.setAttribute('stroke-linecap','round');
    arc.setAttribute('transform','rotate(-90 '+(size/2)+' '+(size/2)+')');
    arc.style.transition='stroke-dasharray 0.5s ease';
    svg.appendChild(arc);
  }
  const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
  txt.setAttribute('x',size/2); txt.setAttribute('y',size/2+5); txt.setAttribute('text-anchor','middle');
  txt.setAttribute('fill',value!=null?(textColor||color):'#333'); txt.setAttribute('font-size',value!=null?15:10);
  txt.setAttribute('font-family',"'JetBrains Mono',monospace"); txt.setAttribute('font-weight','700');
  txt.textContent=value!=null?Math.round(value):'--';
  svg.appendChild(txt);
  const wrap=div({class:'ring-wrap'});
  wrap.appendChild(svg);
  wrap.appendChild(span({class:'ring-lbl'},label));
  return wrap;
}
function fieldGroup(labelText, inputEl){
  const wrap=div({});
  wrap.appendChild(lbl(labelText));
  wrap.appendChild(inputEl);
  return wrap;
}
function numInp(labelText,val,cb,unit,hint,hintColor){
  const i=inp({type:'number',class:'inp',value:val||'',placeholder:''});
  i.addEventListener('input',()=>cb(i.value));
  const row=div({class:'flex'},[i]);
  if(unit) row.appendChild(span({style:{fontSize:'10px',color:'#4a4a6a',whiteSpace:'nowrap'}},unit));
  const wrap=div({});
  if(labelText) wrap.appendChild(lbl(labelText));
  wrap.appendChild(row);
  if(hint){
    const h=span({class:'hint',style:{color:hintColor||'#666'}},hint);
    wrap.appendChild(h);
  }
  return wrap;
}
function selField(labelText,val,opts,cb){
  const s=sel({class:'sel'},opts,val);
  s.addEventListener('change',()=>cb(s.value));
  const wrap=div({});
  if(labelText) wrap.appendChild(lbl(labelText));
  wrap.appendChild(s);
  return wrap;
}

// Activity type key (used in legend and import validation)
const TYPE_KEY = {
  strength: 'Gym / weights / strength',
  intervals: 'Speed / intervals / threshold / hill reps',
  easy:      'Easy run / recovery / Z2',
  long:      'Long run (auto-set if km > 15)',
  race:      'Race or time trial',
  rest:      'Rest / travel / off day',
  walk:      'Walk',
  sauna:     'Sauna / heat session',
  other:     'Other / cross training',
  rest:       'Rest / travel / off day',
};

function planToCSV(){
  const plan=getPlan();

  const legend=[
    '# TRAINING OS - PLAN EXPORT',
    '# Generated: '+new Date().toLocaleString(),
    '# Race: '+CFG.raceName+' ('+CFG.raceDateStr+')',
    '# Block start (Monday): '+localDateStr(getBlockMonday()),
    '#',
    '# HOW TO USE:',
    '# - One row per activity. Multiple activities on the same day = multiple rows with the same date.',
    '# - Keep the header row (week,date,day,...) intact',
    '# - Leave days with no activities blank (just omit rows for that day)',
    '# - Import back via Settings > Plan Export / Import',
    '#',
    '# ACTIVITY TYPES (use exactly as shown in the "type" column):',
    ...Object.entries(TYPE_KEY).map(([k,v])=>'#   '+k.padEnd(12)+' = '+v),
    '#',
    '# WEEK TYPES: RECOVERY | BUILD | SHARPEN | DELOAD | RACE',
    '#',
  ];

  const header='week,date,day,week_type,activity_name,type,km,vert_m,hrs,notes';
  const rows=[];

  plan.forEach((wk,wIdx)=>{
    const t=TARGETS[wIdx]||{};
    let weekHasRows=false;
    wk.days.forEach((d,dIdx)=>{
      const dateStr=slotDate(wIdx,d.day);
      const acts=getDayActivities(wIdx,dIdx);
      const s=getSession(wIdx,dIdx);

      if(acts.length>0){
        // One row per activity
        acts.forEach(act=>{
          const km=act.completed?parseFloat(act.actualKm||0):parseFloat(act.planned?.km||0)||0;
          const vert=act.completed?parseFloat(act.actualVert||0):parseFloat(act.planned?.vert||0)||s.vert||0;
          const hrs=act.completed?parseFloat(act.actualHrs||0):parseFloat(act.planned?.hrs||0)||0;
          rows.push([
            wIdx+1, dateStr, d.day, t.type||'BUILD',
            '"'+(act.label||'').replace(/"/g,"'")+'"',
            act.type||'easy',
            km||'', vert||'', hrs||'',
            '"'+(act.detail||'').replace(/"/g,"'")+'"',
          ].join(','));
          weekHasRows=true;
        });
      } else if(s&&s.label){
        // Session in EDITS but no RUNS activities -- export as single row
        rows.push([
          wIdx+1, dateStr, d.day, t.type||'BUILD',
          '"'+s.label.replace(/"/g,"'")+'"',
          s.type||'easy',
          s.km||'', s.vert||'', s.hrs||'',
          '"'+(s.detail||'').replace(/"/g,"'")+'"',
        ].join(','));
        weekHasRows=true;
      }
      // Empty days -- omit (no row)
    });
    if(weekHasRows) rows.push(''); // blank separator between weeks
  });

  return [...legend, header, ...rows].join('\n');
}

function csvToEdits(csv){
  const plan=getPlan();
  const lines=csv.split('\n').filter(l=>l.trim()&&!l.trim().startsWith('#'));
  if(!lines.length) return {edits:{},importedCount:0};

  const headerIdx=lines.findIndex(l=>l.toLowerCase().includes('week')&&l.toLowerCase().includes('date')&&l.toLowerCase().includes('day'));
  const startIdx=headerIdx>=0?headerIdx+1:1;

  const edits={};
  const newRuns={...RUNS};
  // Track activities per slot so we can append multiple rows for same day
  const slotActivities={}; // key -> [{label,type,km,vert,hrs,detail}]
  let importedCount=0;

  for(let i=startIdx;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line) continue;

    // Parse CSV respecting quoted fields
    const cols=[];
    let cur='', inQ=false;
    for(let c=0;c<line.length;c++){
      const ch=line[c];
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){cols.push(cur.trim());cur='';}
      else{cur+=ch;}
    }
    cols.push(cur.trim());
    if(cols.length<3) continue;

    let wk,dateStr,dayName,weekType,label,type,km,vert,hrs,detail;
    const hasDate=cols[1]&&cols[1].match(/^\d{4}-\d{2}-\d{2}$/);
    if(hasDate){
      wk=parseInt(cols[0]); dateStr=cols[1]; dayName=cols[2];
      weekType=(cols[3]||'').toUpperCase();
      label=(cols[4]||'').replace(/^"|"$/g,'').trim();
      type=(cols[5]||'easy').trim().toLowerCase()||'easy';
      km=parseFloat(cols[6])||0; vert=parseFloat(cols[7])||0; hrs=parseFloat(cols[8])||0;
      detail=(cols[9]||'').replace(/^"|"$/g,'').trim();
    } else {
      wk=parseInt(cols[0]); dayName=cols[1];
      label=(cols[2]||'').replace(/^"|"$/g,'').trim();
      type=(cols[3]||'easy').trim().toLowerCase()||'easy';
      km=parseFloat(cols[4])||0; vert=parseFloat(cols[5])||0; hrs=parseFloat(cols[6])||0;
      detail=(cols[7]||'').replace(/^"|"$/g,'').trim();
    }

    if(!label) continue;
    type=autoUpgradeType(type,km);
    if(!TYPE_KEY[type]) type='easy';

    const wIdx=wk-1;
    if(!plan[wIdx]) continue;

    let dIdx=-1;
    if(dateStr) dIdx=plan[wIdx].days.findIndex((_,di)=>slotDate(wIdx,plan[wIdx].days[di].day)===dateStr);
    if(dIdx<0) dIdx=plan[wIdx].days.findIndex(d=>d.day===dayName);
    if(dIdx<0) continue;

    if(weekType&&WEEK_TYPES.includes(weekType)&&TARGETS[wIdx]){
      TARGETS[wIdx]={...TARGETS[wIdx],type:weekType};
    }

    const key='w'+wIdx+'-d'+dIdx;
    if(!slotActivities[key]) slotActivities[key]={wIdx,dIdx,acts:[]};
    slotActivities[key].acts.push({label,type,km,vert,hrs,detail});
    importedCount++;
  }

  // Write all collected activities into RUNS and set EDITS slot summary
  Object.entries(slotActivities).forEach(([key,{wIdx,dIdx,acts}])=>{
    const slotDs=slotDate(wIdx,plan[wIdx].days[dIdx].day);
    const isPast=slotDs<=today();
    const existing=newRuns[key]||[];
    const existingLabels=new Set(existing.map(a=>a.label));

    const toAdd=acts.filter(a=>!existingLabels.has(a.label)).map(a=>({
      id:newActId(),
      label:a.label, type:a.type, detail:a.detail,
      actualKm:'', actualVert:'', actualHrs:'',
      perf:'', exec:'', note:'',
      completed:false,
      ts:Date.now(),
      planned:{km:a.km, vert:a.vert, hrs:a.hrs},
    }));

    if(toAdd.length) newRuns[key]=[...existing,...toAdd];

    // Set EDITS slot to primary activity for label/type display
    const primary=acts[0];
    const totalKm=acts.reduce((s,a)=>s+a.km,0);
    const totalVert=acts.reduce((s,a)=>s+a.vert,0);
    const totalHrs=acts.reduce((s,a)=>s+a.hrs,0);
    edits[key]={
      label:acts.length>1?acts.map(a=>a.label).join(' + '):primary.label,
      type:primary.type,
      detail:primary.detail,
      km:totalKm, vert:totalVert, hrs:totalHrs,
    };
  });

  RUNS=newRuns; S.set(SK.runs,RUNS);
  S.set(SK.targets,TARGETS);
  return {edits,importedCount};
}

function download(content,filename,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=filename; a.click();
}
function exportAll(){
  const bundle={version:2,exportedAt:new Date().toISOString(),CFG,LOG,EDITS,TARGETS,RUNS};
  download(JSON.stringify(bundle,null,2),'training-os-backup.json','application/json');
}
function importAll(json){
  try{
    const b=JSON.parse(json);
    if(!b.version) throw new Error('Invalid file');
    if(b.CFG){CFG=b.CFG;S.set(SK.cfg,CFG);}
    if(b.LOG){LOG=b.LOG;S.set(SK.log,LOG);}
    if(b.EDITS){EDITS=b.EDITS;S.set(SK.edits,EDITS);}
    if(b.TARGETS){TARGETS=b.TARGETS;S.set(SK.targets,TARGETS);}
    if(b.RUNS){RUNS=b.RUNS;S.set(SK.runs,RUNS);}
    return 'Data restored. Reloading...';
  }catch(e){ return 'Import failed: '+e.message; }
}

    ['3. Copy to clipboard','Add a "Copy to Clipboard" action after the URL fetch. Name the shortcut something like "TP Sync". Add it to your home screen.'],
    ['4. Run & paste','Tap your shortcut. It fetches your TP calendar and copies the raw text. Come back here, tap the paste area below, and tap Paste.'],
    ['5. Import','Tap "Import Calendar". The app matches your TP workouts to the plan by date and overwrites session names and details. Km/vert/hr targets are kept from the built-in plan unless you edit them.'],
  ];

  steps.forEach(([title,body])=>{
    const stepDiv=div({style:{marginBottom:'14px',paddingBottom:'14px',borderBottom:'1px solid var(--border-subtle)'}});
    stepDiv.appendChild(div({style:{fontSize:'10px',color:'#b8ff4f',letterSpacing:'0.1em',marginBottom:'5px'}},title));
    stepDiv.appendChild(div({style:{fontSize:'11px',color:'#888',lineHeight:'1.7'}},body));
    sheet.appendChild(stepDiv);
  });

  sheet.appendChild(div({style:{padding:'12px',background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:'6px',marginBottom:'16px',fontSize:'10px',color:'#555',lineHeight:'1.8'}},
    'Tip: If your TP link starts with webcal://, change it to https:// in the Shortcut URL field -- both work but https is more reliable in Shortcuts.'
  ));

  sheet.appendChild(btn({class:'btn',onclick:()=>overlay.remove()},'Got it'));
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
}

// ============================================================
// RENDER ENGINE
// ============================================================
function applyTheme(){
  if((CFG.theme||'dark')==='light') document.body.classList.add('light');
  else document.body.classList.remove('light');
}
function render(){ applyTheme(); syncTargets(); renderHeader(); renderTabs(); renderContent(); }

function renderHeader(){
  const h=document.getElementById('header');
  h.innerHTML='';
  const nextRace=getNextRace();
  const allRaces=getRaces();
  const td=today();
  const upcomingRaces=allRaces.filter(r=>r.date>=td).slice(0,2);
  const days=nextRace?daysTo(nextRace.date):null;
  const daysNum=typeof days==='number'?days:null;
  const daysColor=daysNum===null?'#555':daysNum<=14?'#ff6b6b':daysNum<=42?'#ffd166':'#00ff87';
  const cw=curWeek(), tw=totalWeeks();
  const phase=TARGETS[cw-1]?.type||'--';
  const phColor=WTC[phase]||'#888';

  h.appendChild(div({style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},[
    div({},[
      span({style:{fontSize:'9px',color:'#4a4a6a',letterSpacing:'0.2em',textTransform:'uppercase',display:'block',marginBottom:'2px'}},CFG.raceName),
      span({style:{fontSize:'28px',fontFamily:"'Bebas Neue',cursive",letterSpacing:'0.04em',lineHeight:'1',display:'block'}},'TRAINING OS'),
      span({style:{fontSize:'10px',color:'#555',display:'block',marginTop:'3px'}},fmtToday()),
    ]),
    div({style:{textAlign:'right'}},[
      span({style:{fontSize:'26px',fontFamily:"'Bebas Neue',cursive",color:daysColor,lineHeight:'1',display:'block'}},daysNum!==null?daysNum+'':'--'),
      span({style:{fontSize:'9px',color:'#4a4a6a',letterSpacing:'0.1em',display:'block'}},nextRace?'DAYS TO '+nextRace.name.toUpperCase().split(' ')[0]:'DAYS TO RACE'),
      nextRace?span({style:{fontSize:'9px',color:'#333',display:'block',marginTop:'1px'}},nextRace.date+(nextRace.dist?' · '+nextRace.dist:'')):null,
    ]),
  ]));

  const {mon:wMon,sun:wSun}=weekDates(cw-1);
  const pillRow=div({style:{display:'flex',gap:'6px',marginTop:'10px',flexWrap:'wrap'}});
  pillRow.appendChild(span({style:{fontSize:'9px',background:'#1a1a2e',border:'1px solid #2a2a4a',color:'#888',padding:'3px 8px',borderRadius:'4px'}},'WK '+cw+'/'+tw));
  pillRow.appendChild(span({style:{fontSize:'9px',background:phColor+'18',border:'1px solid '+phColor+'35',color:phColor,padding:'3px 8px',borderRadius:'4px'}},phase));
  pillRow.appendChild(span({style:{fontSize:'9px',background:'#1a1a2e',border:'1px solid #2a2a4a',color:'#555',padding:'3px 8px',borderRadius:'4px'}},fmtDate(wMon)+' - '+fmtDate(wSun)));
  // Show second upcoming race if exists
  if(upcomingRaces.length>1){
    const r2=upcomingRaces[1];
    const d2=daysTo(r2.date);
    pillRow.appendChild(span({style:{fontSize:'9px',background:'#fd79a820',border:'1px solid #fd79a840',color:'#fd79a8',padding:'3px 8px',borderRadius:'4px'}},r2.name.split(' ')[0]+' '+fmtDate(new Date(r2.date+'T12:00:00'))+' · '+d2+'d'));
  }
  h.appendChild(pillRow);
}

function renderTabs(){
  const bar=document.getElementById('tabs');
  bar.innerHTML='';
  const tabs=[{id:'today',label:'TODAY'},{id:'plan',label:'PLAN'},{id:'block',label:'BLOCK'},{id:'trend',label:'TREND'},{id:'settings',label:'⚙'}];
  tabs.forEach(t=>{
    const b=btn({class:'tab'+(ACTIVE_TAB===t.id?' active':''),onclick:()=>{ACTIVE_TAB=t.id;EXPANDED_DAY=null;EDITING_DAY=null;render();}},t.label);
    if(t.id==='settings') b.style.fontSize='16px';
    bar.appendChild(b);
  });
}

function renderContent(){
  const c=document.getElementById('content');
  c.innerHTML='';
  if(ACTIVE_TAB==='today') c.appendChild(renderToday());
  else if(ACTIVE_TAB==='block') c.appendChild(renderBlock());
  else if(ACTIVE_TAB==='plan') c.appendChild(renderPlan());
  else if(ACTIVE_TAB==='trend') c.appendChild(renderTrend());
  else if(ACTIVE_TAB==='settings') c.appendChild(renderSettings());
}

// ============================================================
// TODAY TAB
// ============================================================
function renderToday(){
  const wrap=div({});
  const td=today();
  const saved=LOG[td]||{};
  const wIdx=curWeek()-1;
  const dow=new Date().getDay();
  const plan=getPlan();
  const dIdx=plan[wIdx]?.days.findIndex(d=>dowIndex(d.day)===dow)??-1;
  const todaySess=dIdx>=0?getSession(wIdx,dIdx):null;
  const todayRun=dIdx>=0?getRunLog(wIdx,dIdx):null;

  // State held in closure vars updated by inputs
  let hrv=saved.hrv||'', rhr=saved.rhr||'', sleep=saved.sleep||'';
  let legs=saved.legs||'', mood=saved.mood||'', mot=saved.motivation||'', rpe=saved.rpe||'';
  let note=saved.note||'';

  function computeScores(){
    const h=scoreHRV(hrv), r=scoreRHR(rhr), s=scoreSleep(sleep);
    const physVals=[h,r,s].filter(x=>x!=null);
    const rScore=physVals.length?Math.round(physVals.reduce((a,b)=>a+b,0)/physVals.length):null;
    const sScore=scoreSub(legs,mood,mot);
    const combined=rScore!=null&&sScore!=null?Math.round((rScore+sScore)/2):(rScore??sScore);
    return {rScore,sScore,combined};
  }

  // Today's session card -- shown first so it's closest to the data inputs
  const sessCardWrap=div({});
  if(todaySess||(dIdx>=0&&getDayActivities(wIdx,dIdx).length>0)){
    const allTodayActs=dIdx>=0?getDayActivities(wIdx,dIdx):[];
    const hasActs=allTodayActs.length>0;

    // Card border colour: use primary type
    const primaryType=allTodayActs[0]?.type||todaySess?.type||'easy';
    const primaryTc=TC[primaryType]||'#555';

    const sessCard=div({style:{padding:'12px 14px',marginBottom:'16px',background:'var(--bg-card)',border:'1px solid '+primaryTc+'40',borderRadius:'8px'}});

    // Header: type badges + day label + done count
    const hdrRow=div({style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'8px'}});
    const badgeTypes=hasActs
      ?[...new Set(allTodayActs.map(a=>a.type||todaySess?.type||'easy'))]
      :[];
    const bwrap=div({style:{display:'flex',gap:'2px'}});
    badgeTypes.forEach(t=>bwrap.appendChild(span({style:{fontSize:'9px',background:TC[t]||'#555',color:'#000',padding:'2px 5px',borderRadius:'3px',fontWeight:'700'}},TL[t]||'--')));
    hdrRow.appendChild(bwrap);
    hdrRow.appendChild(span({style:{fontSize:'9px',color:'var(--text-mute)',letterSpacing:'0.1em',flex:'1'}},'TODAY · WK '+(wIdx+1)));
    hdrRow.appendChild(span({style:{fontSize:'8px',color:'#000',background:'#b8d400',padding:'2px 6px',borderRadius:'3px',fontWeight:'700',letterSpacing:'0.06em'}},'CURRENT'));
    const doneCount=allTodayActs.filter(a=>a.completed).length;
    if(doneCount>0){
      hdrRow.appendChild(span({style:{fontSize:'9px',color:'#00ff87',fontWeight:'700',background:'#00ff8720',padding:'2px 6px',borderRadius:'4px',border:'1px solid #00ff8740'}},doneCount+'/'+allTodayActs.length+' done'));
    }
    sessCard.appendChild(hdrRow);

    if(hasActs){
      allTodayActs.forEach((act,aIdx)=>{
        const atc=TC[act.type||'easy']||'#555';
        const actRow=div({style:{
          padding:'8px 0',
          borderTop:aIdx>0?'1px solid var(--border-subtle)':'none',
        }});

        const mainLine=div({style:{display:'flex',alignItems:'center',gap:'8px'}});
        mainLine.appendChild(span({style:{fontSize:'8px',background:atc,color:'#000',padding:'1px 5px',borderRadius:'2px',fontWeight:'700',flexShrink:'0'}},TL[act.type||'easy']||'--'));

        const actInfo=div({style:{flex:'1',minWidth:'0',cursor:'pointer'}});
        actInfo.appendChild(div({style:{fontSize:'11px',color:act.completed?'var(--text-mute)':'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:act.completed?'400':'600'}},act.label||'Activity'));

        const hasActuals=act.completed&&(act.actualKm||act.actualHrs);
        const hasPlanned=act.planned&&(act.planned.km||act.planned.hrs);
        if(hasActuals){
          actInfo.appendChild(div({style:{fontSize:'10px',color:'#00c96e',marginTop:'2px',fontWeight:'600'}},
            (act.actualKm?act.actualKm+'km ':'')+
            (act.actualVert?act.actualVert+'m ':'')+
            fmtHms(parseFloat(act.actualHrs||0))));
        } else if(hasPlanned){
          actInfo.appendChild(div({style:{fontSize:'9px',color:'var(--text-mute)',marginTop:'2px'}},
            (act.planned.km?act.planned.km+'km ':'')+
            fmtHms(act.planned.hrs||0)));
        }
        mainLine.appendChild(actInfo);

        // Button group: Log/Edit + Unlog
        const btnGroup=div({style:{display:'flex',gap:'4px',flexShrink:'0'}});

        btnGroup.appendChild(btn({style:{padding:'5px 10px',borderRadius:'5px',fontSize:'10px',
          background:act.completed?'#00c96e18':'var(--bg-btn)',
          border:'1px solid '+(act.completed?'#00c96e50':'var(--border-btn)'),
          color:act.completed?'#007a42':'var(--text)'},
          onclick:()=>showActivityModal(wIdx,dIdx,aIdx,todaySess)},
          act.completed?'✓ Edit':'Log'));

        if(act.completed){
          btnGroup.appendChild(btn({style:{padding:'5px 7px',borderRadius:'5px',fontSize:'10px',
            background:'var(--bg-btn)',border:'1px solid var(--border)',color:'var(--text-mute)'},
            title:'Unlog -- revert to planned',
            onclick:()=>{
              const updated=[...getDayActivities(wIdx,dIdx)];
              updated[aIdx]={...updated[aIdx],completed:false};
              saveDayActivities(wIdx,dIdx,updated);
              render();
            }},'↩'));
        }

        mainLine.appendChild(btnGroup);
        actRow.appendChild(mainLine);

        // Detail -- expandable on tap of actInfo only
        const hasDetail=act.detail&&act.detail.trim();
        if(hasDetail){
          const detailDiv=div({style:{display:'none',fontSize:'10px',color:'var(--text-mute)',lineHeight:'1.6',marginTop:'6px',paddingTop:'6px',borderTop:'1px solid var(--border-subtle)'}},act.detail);
          actInfo.addEventListener('click',()=>{
            detailDiv.style.display=detailDiv.style.display==='none'?'block':'none';
          });
          actRow.appendChild(detailDiv);
        }

        sessCard.appendChild(actRow);
      });

      // + Add activity to today (creates unlogged planned entry)
      sessCard.appendChild(btn({style:{width:'100%',marginTop:'8px',padding:'7px',borderRadius:'6px',
        fontSize:'10px',background:'var(--bg-input)',border:'1px dashed var(--border-btn)',
        color:'var(--text-mute)'},
        onclick:()=>{
          const newAct={id:newActId(),label:'',type:'easy',detail:'',
            actualKm:'',actualVert:'',actualHrs:'',perf:'',exec:'',note:'',
            completed:false,ts:Date.now(),planned:{km:0,hrs:0}};
          const existing=getDayActivities(wIdx,dIdx);
          saveDayActivities(wIdx,dIdx,[...existing,newAct]);
          // Open modal immediately to fill in details
          showActivityModal(wIdx,dIdx,existing.length,todaySess);
        }},'+ Add activity'));

    } else if(todaySess){
      // Fallback: no activities in RUNS yet, show plan session with single log button
      sessCard.appendChild(div({style:{fontSize:'13px',color:'var(--text)',marginBottom:'3px'}},todaySess.label));
      sessCard.appendChild(div({style:{fontSize:'11px',color:'var(--text-mute)',lineHeight:'1.5',marginBottom:'8px'}},todaySess.detail));
      sessCard.appendChild(div({style:{display:'flex',gap:'12px',marginBottom:'8px'}},[
        span({style:{fontSize:'10px',color:'var(--text-dim)'}},todaySess.km+'km'),
        span({style:{fontSize:'10px',color:'var(--text-dim)'}},todaySess.vert+'m'),
        span({style:{fontSize:'10px',color:'var(--text-dim)'}},fmtHms(todaySess.hrs)),
      ]));
      sessCard.appendChild(btn({class:'btn-sm',onclick:()=>showRunModal(wIdx,dIdx,todaySess,null)},'Log this session'));
    }

    sessCardWrap.appendChild(sessCard);
  }
  wrap.appendChild(sessCardWrap);

  // Decision banner
  const decBanner=div({style:{padding:'14px 16px',marginBottom:'20px',borderRadius:'8px',border:'1px solid var(--border)',background:'var(--bg-card)'}});
  decBanner.id='dec-banner';

  // Rings row
  const ringsRow=div({style:{display:'flex',justifyContent:'space-around',padding:'16px 0',marginBottom:'20px',borderTop:'1px solid var(--border-subtle)',borderBottom:'1px solid var(--border-subtle)'}});
  ringsRow.id='rings-row';

  function updateDecision(){
    const {rScore,sScore,combined}=computeScores();
    const dec=combined!=null?getDecision(combined):null;

    decBanner.innerHTML='';
    if(dec){
      decBanner.style.background=dec.color+'18';
      decBanner.style.border='1px solid '+dec.color+'50';
      decBanner.style.borderLeft='3px solid '+dec.color;
      decBanner.appendChild(span({style:{fontSize:'20px',fontFamily:"'Bebas Neue',cursive",letterSpacing:'0.1em',color:dec.textColor||dec.color,display:'block'}},dec.label));
      decBanner.appendChild(span({style:{fontSize:'11px',color:'var(--text-mute)',marginTop:'4px',lineHeight:'1.6',display:'block'}},dec.desc));
    } else {
      decBanner.style.background='var(--bg-card)';
      decBanner.style.border='1px solid var(--border)';
      decBanner.style.borderLeft='1px solid var(--border)';
      decBanner.appendChild(span({style:{fontSize:'12px',color:'var(--text-mute)'}},'Enter readings to get today\'s decision'));
    }

    // Update rings
    ringsRow.innerHTML='';
    ringsRow.appendChild(ring(rScore,'#60a5fa','Physical'));
    ringsRow.appendChild(ring(combined,dec?.color||'#333','Combined',88,dec?.textColor));
    ringsRow.appendChild(ring(sScore,'#c084fc','Subjective'));
  }

  wrap.appendChild(decBanner);
  wrap.appendChild(ringsRow);
  updateDecision();

  // Pre-populate RPE from yesterday's activity RPE if not already saved today
  if(!saved.rpe){
    const yd=new Date(); yd.setDate(yd.getDate()-1);
    const ydStr=localDateStr(yd);
    // Check yesterday's daily log first
    if(LOG[ydStr]?.rpe) rpe=LOG[ydStr].rpe;
    else {
      // Use yesterday's activity RPE (exec field) -- highest RPE across all activities
      const ydDow=yd.getDay();
      const ydPlan=getPlan();
      const ydWIdx=Math.max(0,Math.floor((yd-getBlockMonday())/(7*86400000)));
      if(ydPlan[ydWIdx]){
        const ydDIdx=ydPlan[ydWIdx].days.findIndex(d=>dowIndex(d.day)===ydDow);
        if(ydDIdx>=0){
          const ydActs=getDayActivities(ydWIdx,ydDIdx).filter(a=>a.completed);
          if(ydActs.length){
            // Use highest RPE across all activities that day
            const maxRPE=ydActs.reduce((max,a)=>Math.max(max,parseInt(a.exec||0)),0);
            if(maxRPE>0) rpe=String(maxRPE);
          }
        }
      }
    }
  }

  // HRV / RHR inputs
  const grid1=div({class:'grid2',style:{marginBottom:'12px'}});
  const hrvN=parseFloat(hrv);
  const hrvHint=!isNaN(hrvN)?(hrvN<CFG.hrvLow?{t:'Below range',c:'#e05050'}:hrvN>CFG.hrvHigh?{t:'Above range',c:'#2a9d60'}:{t:'In range ✓',c:'#2a9d60'}):null;
  const rhrN=parseFloat(rhr);
  const rhrHint=!isNaN(rhrN)?(rhrN<CFG.rhrLow?{t:'Below baseline',c:'#2a9d60'}:rhrN>CFG.rhrHigh?{t:'Elevated',c:'#e05050'}:{t:'Baseline ✓',c:'#2a9d60'}):null;

  const hrvF=numInp('HRV',hrv,v=>{hrv=v;updateDecision();},'ms',hrvHint?.t,hrvHint?.c);
  const rhrF=numInp('Resting HR',rhr,v=>{rhr=v;updateDecision();},'bpm',rhrHint?.t,rhrHint?.c);
  grid1.appendChild(hrvF); grid1.appendChild(rhrF);
  wrap.appendChild(grid1);

  const grid2=div({class:'grid2',style:{marginBottom:'12px'}});
  grid2.appendChild(selField('Sleep',sleep,[{v:'great',l:'Solid 8+'},{v:'ok',l:'6-7hr OK'},{v:'poor',l:'Poor / broken'}],v=>{sleep=v;updateDecision();}));
  grid2.appendChild(selField('Yesterday RPE',rpe,[{v:'0',l:'0 - Rest'},{v:'1',l:'1 - Active recovery'},{v:'2',l:'2 - Very easy'},{v:'3',l:'3 - Easy'},{v:'4',l:'4 - Moderate'},{v:'5',l:'5 - Comfortably hard'},{v:'6',l:'6 - Hard'},{v:'7',l:'7 - Very hard'},{v:'8',l:'8 - Race effort'},{v:'9',l:'9 - Near maximal'},{v:'10',l:'10 - Maximal'}],v=>{rpe=v;updateDecision();}));
  grid2.appendChild(selField('Legs',legs,[{v:'5',l:'5 Fresh'},{v:'4',l:'4 Good'},{v:'3',l:'3 OK'},{v:'2',l:'2 Heavy'},{v:'1',l:'1 Wrecked'}],v=>{legs=v;updateDecision();}));
  grid2.appendChild(selField('Mood',mood,[{v:'5',l:'5 Sharp'},{v:'4',l:'4 Good'},{v:'3',l:'3 OK'},{v:'2',l:'2 Stressed'},{v:'1',l:'1 Flat'}],v=>{mood=v;updateDecision();}));
  wrap.appendChild(grid2);

  wrap.appendChild(div({style:{marginBottom:'16px'}},[selField('Motivation',mot,[{v:'5',l:'5 Hungry'},{v:'4',l:'4 Ready'},{v:'3',l:'3 OK'},{v:'2',l:'2 Meh'},{v:'1',l:'1 None'}],v=>{mot=v;updateDecision();})]));

  const noteWrap=div({style:{marginBottom:'16px'}});
  noteWrap.appendChild(lbl('Session note'));
  const ta=el('textarea',{class:'inp',rows:'2',placeholder:'Anything worth logging...'},note);
  ta.addEventListener('input',()=>{note=ta.value;});
  noteWrap.appendChild(ta);
  wrap.appendChild(noteWrap);

  const saveBtn=btn({class:'btn',onclick:()=>{
    const {rScore,sScore,combined}=computeScores();
    const dec=combined!=null?getDecision(combined):null;
    const entry={hrv,rhr,sleep,legs,mood,motivation:mot,rpe,note,decision:dec?.label,ts:Date.now()};
    LOG[td]=entry; S.set(SK.log,LOG);
    saveBtn.textContent='LOGGED'; saveBtn.style.color='#00ff87'; saveBtn.style.borderColor='#00ff87';
    setTimeout(()=>{saveBtn.textContent='LOG TODAY';saveBtn.style.color='';saveBtn.style.borderColor='';},1800);
  }},'LOG TODAY');
  wrap.appendChild(saveBtn);

  return wrap;
}

// ============================================================
// ACTIVITY MODAL (per-activity log within a day)
// ============================================================
function showActivityModal(wIdx, dIdx, aIdx, planSession){
  const activities=getDayActivities(wIdx,dIdx);
  const existing=activities[aIdx]||{};
  const overlay=div({class:'modal-bg',onclick:e=>{if(e.target===overlay)overlay.remove();}});
  const sheet=div({class:'modal'});
  sheet.appendChild(div({class:'modal-handle'}));

  // Activity label + type (editable)
  let label=existing.label||planSession?.label||'';
  let type=existing.type||planSession?.type||'easy';
  let akm=existing.actualKm||'';
  let avert=existing.actualVert||'';
  let ahrs=existing.actualHrs||'';
  let perf=existing.perf||'';
  let exec=existing.exec||'';
  let note=existing.note||'';

  const tc=()=>TC[type]||'#555';

  // Header
  const hdrDiv=div({style:{marginBottom:'14px'}});
  const labelI=inp({class:'inp',type:'text',value:label,placeholder:'Activity name'});
  labelI.addEventListener('input',()=>label=labelI.value);
  hdrDiv.appendChild(div({},[lbl('Activity name'),labelI]));
  sheet.appendChild(hdrDiv);

  // Type selector -- uses a container we can re-render on selection
  const typeDiv=div({style:{marginBottom:'14px'}});
  typeDiv.appendChild(lbl('Type'));
  const typeBtns=div({style:{display:'flex',gap:'5px',flexWrap:'wrap'}});

  function renderTypeBtns(){
    typeBtns.innerHTML='';
    ALL_TYPES.forEach(t=>{
      const isActive=type===t;
      const color=TC[t]||'#555';
      const b=btn({style:{padding:'5px 8px',borderRadius:'4px',fontSize:'9px',
        background:isActive?color+'30':'#0a0a18',
        border:'1px solid '+(isActive?color:'#2a2a4a'),
        color:isActive?color:'#555'},
        onclick:()=>{ type=t; renderTypeBtns(); }},
        TL[t]||t.toUpperCase());
      typeBtns.appendChild(b);
    });
  }
  renderTypeBtns();
  typeDiv.appendChild(typeBtns);
  sheet.appendChild(typeDiv);

  // Planned vs actual
  if(planSession?.km||planSession?.vert||planSession?.hrs){
    sheet.appendChild(div({style:{display:'flex',gap:'14px',marginBottom:'8px',padding:'8px',background:'var(--bg-input)',borderRadius:'6px'}},[
      span({style:{fontSize:'9px',color:'#333'}},'PLANNED:'),
      span({style:{fontSize:'10px',color:'#444'}},planSession.km+'km'),
      span({style:{fontSize:'10px',color:'#444'}},planSession.vert+'m'),
      span({style:{fontSize:'10px',color:'#444'}},fmtHms(planSession.hrs)),
    ]));
  }

  // Actual inputs -- time shown as h:mm, accepts h:mm or decimal
  const actGrid=div({class:'grid3',style:{marginBottom:'12px'}});
  [['km',akm,v=>akm=v,'number','km'],
   ['m',avert,v=>avert=v,'number','m'],
   ['h:mm',ahrs?fmtHms(parseFloat(ahrs)||0):'',v=>ahrs=v,'text','time']
  ].forEach(([unit,val,cb,itype,u])=>{
    const isTime=u==='time';
    const i=inp({type:itype,value:val,placeholder:isTime?'h:mm':'0',
      style:{background:'var(--bg-input)',border:'1px solid #22223a',color:'var(--text)',
        padding:'7px 8px',borderRadius:'5px',fontSize:'13px',outline:'none',width:'100%'}});
    i.addEventListener('input',()=>cb(i.value));
    actGrid.appendChild(div({},[lbl(unit),i]));
  });
  sheet.appendChild(actGrid);

  const rGrid=div({class:'grid2',style:{marginBottom:'12px'}});
  rGrid.appendChild(selField('Performance',perf,[{v:'5',l:'5 Exceeded'},{v:'4',l:'4 Solid'},{v:'3',l:'3 Met plan'},{v:'2',l:'2 Below'},{v:'1',l:'1 Poor'}],v=>perf=v));
  rGrid.appendChild(selField('RPE',exec,[{v:'0',l:'0 - Rest'},{v:'1',l:'1 - Active recovery'},{v:'2',l:'2 - Very easy'},{v:'3',l:'3 - Easy'},{v:'4',l:'4 - Moderate'},{v:'5',l:'5 - Comfortably hard'},{v:'6',l:'6 - Hard'},{v:'7',l:'7 - Very hard'},{v:'8',l:'8 - Race effort'},{v:'9',l:'9 - Near maximal'},{v:'10',l:'10 - Maximal'}],v=>exec=v));
  sheet.appendChild(rGrid);

  const noteWrap=div({style:{marginBottom:'14px'}});
  noteWrap.appendChild(lbl('Note'));
  const ta=el('textarea',{class:'inp',rows:'2',placeholder:'How did it feel?'},note);
  ta.addEventListener('input',()=>note=ta.value);
  noteWrap.appendChild(ta);
  sheet.appendChild(noteWrap);

  const btnRow=div({style:{display:'flex',gap:'8px'}});
  const saveBtn=btn({class:'btn btn-ok',style:{flex:'1'},onclick:()=>{
    const updated=[...getDayActivities(wIdx,dIdx)];
    const slotDs=slotDate(wIdx,getPlan()[wIdx]?.days[dIdx]?.day||'Mon');
    const isLoggedDay=slotDs<=today();
    updated[aIdx]={
      id:existing.id||newActId(),
      label, type,
      actualKm:akm, actualVert:avert, actualHrs:parseHms(ahrs)||'',
      perf, exec, note,
      completed:isLoggedDay, ts:Date.now()
    };
    saveDayActivities(wIdx,dIdx,updated);
    overlay.remove(); render();
  }},'SAVE');
  btnRow.appendChild(saveBtn);

  // Unlog -- only shown if currently completed
  if(existing.completed){
    btnRow.appendChild(btn({class:'btn-sm',style:{background:'var(--bg-btn)',border:'1px solid var(--border)',color:'var(--text-mute)'},
      onclick:()=>{
        const updated=[...getDayActivities(wIdx,dIdx)];
        updated[aIdx]={...updated[aIdx],completed:false};
        saveDayActivities(wIdx,dIdx,updated);
        overlay.remove(); render();
      }},'↩ Unlog'));
  }

  const closeBtn=btn({class:'btn-sm btn-ghost',onclick:()=>overlay.remove()},'Close');
  btnRow.appendChild(closeBtn);
  sheet.appendChild(btnRow);

  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
}

// RUN MODAL -- now wraps showActivityModal for TODAY tab compat

function showRunModal(wIdx,dIdx,session,existing){
  // If no activities yet, create one seeded from plan session
  const activities=getDayActivities(wIdx,dIdx);
  if(activities.length===0){
    const newAct={id:newActId(),label:session?.label||'',type:session?.type||'easy',
      actualKm:'',actualVert:'',actualHrs:'',perf:'',exec:'',note:'',completed:false,ts:Date.now()};
    saveDayActivities(wIdx,dIdx,[newAct]);
  }
  showActivityModal(wIdx,dIdx,0,session);
}

// ============================================================
// BLOCK TAB
// ============================================================
function renderBlock(){
  const wrap=div({});
  const plan=getPlan();
  const cw=curWeek();

  // Header
  const hdrRow=div({style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'16px'}});

  hdrRow.appendChild(span({style:{fontSize:'9px',color:'#333'}},fmtDate(getBlockMonday())+' - '+fmtDate(getBlockEnd())));

  // Group weeks by phase
  const groups=[];
  let curGroup=null;
  TARGETS.forEach((t,wIdx)=>{
    if(!curGroup||curGroup.type!==t.type){curGroup={type:t.type,weeks:[]};groups.push(curGroup);}
    curGroup.weeks.push(wIdx);
  });

  groups.forEach(group=>{
    const tc=WTC[group.type]||'#555';
    const phaseTotals=group.weeks.reduce((acc,wIdx)=>{
      const t=TARGETS[wIdx]; acc.km+=t.km; acc.vert+=t.vert; acc.hrs+=t.hrs; return acc;
    },{km:0,vert:0,hrs:0});
    const phaseHdr=div({style:{display:'flex',alignItems:'center',gap:'8px',margin:'10px 0 6px'}});
    phaseHdr.appendChild(span({style:{fontSize:'9px',background:tc+'20',border:'1px solid '+tc+'30',color:tc,padding:'2px 8px',borderRadius:'10px',letterSpacing:'0.1em'}},group.type));
    phaseHdr.appendChild(span({style:{fontSize:'9px',color:'#333'}},phaseTotals.km+'km · '+(phaseTotals.vert>=1000?(phaseTotals.vert/1000).toFixed(0)+'k':phaseTotals.vert)+'m'));
    wrap.appendChild(phaseHdr);

    group.weeks.forEach(wIdx=>{
      let t=TARGETS[wIdx];
      const wn=wIdx+1, isCur=wn===cw, isPast=wn<cw, isFuture=wn>cw;
      const isDone=isPast||isCur; // past or current show actuals
      const tc2=WTC[t.type]||'#555';
      const {mon,sun}=weekDates(wIdx);
      const isEd=BLOCK_EDITING===wIdx; // only used for future weeks

      // Compute actuals
      const actuals=(plan[wIdx]?.days||[]).reduce((acc,_,dIdx)=>{
        const dt=getDayTotals(wIdx,dIdx);
        acc.km+=dt.km; acc.vert+=dt.vert; acc.hrs+=dt.hrs;
        if(isDayDone(wIdx,dIdx)) acc.done++;
        // Count total activities logged
        acc.acts+=getDayActivities(wIdx,dIdx).filter(a=>a.completed).length;
        return acc;
      },{km:0,vert:0,hrs:0,done:0,acts:0});
      const totalDays=plan[wIdx]?.days.length||7;
      const hasActuals=actuals.done>0;

      // For past/current: chevron toggles progress bars; no edit expansion
      // For future: chevron toggles edit panel
      const isExpanded=BLOCK_EDITING===wIdx;
      const toggleExpand=()=>{BLOCK_EDITING=isExpanded?null:wIdx;render();};

      const rowBtn=btn({style:{width:'100%',textAlign:'left',padding:'9px 12px',
        marginBottom:'0',
        background:isExpanded?'var(--bg-elev)':isCur?'#0d0d20':'var(--bg-card)',
        border:'1px solid '+(isExpanded?tc2+'50':isCur?'#2a2a4a':'var(--border)'),
        borderRadius:'8px 8px 0 0',
        display:'flex',alignItems:'center',gap:'8px'},
        onclick:toggleExpand});

      // Week number
      rowBtn.appendChild(span({style:{fontSize:'12px',fontFamily:"'Bebas Neue',cursive",
        color:isCur?'#e0e0ff':isPast?'#555':'#888',minWidth:'22px'}},wn+''));

      const rowText=div({style:{flex:'1',minWidth:0}});
      // Date range + badge row
      const dateRow=div({style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'2px'}});
      dateRow.appendChild(span({style:{fontSize:'10px',color:'var(--text-mute)'}},fmtDate(mon)+' - '+fmtDate(sun)));
      if(isCur) dateRow.appendChild(span({style:{fontSize:'8px',color:'#b8ff4f'}},'NOW'));
      if(isPast&&hasActuals) dateRow.appendChild(span({style:{fontSize:'8px',color:'#00ff87'}},'✓'));
      rowText.appendChild(dateRow);

      // Summary line -- actuals for done weeks, planned for future
      if(isDone&&hasActuals){
        const actKmF=Math.round(actuals.km);
        const actVertF=actuals.vert>=1000?(actuals.vert/1000).toFixed(1)+'k':Math.round(actuals.vert);
        rowText.appendChild(span({style:{fontSize:'10px',color:isPast?'#555':'#b8ff4f'}},
          actKmF+'km · '+actVertF+'m · '+fmtHrTot(actuals.hrs)+' · '+actuals.acts+' activities'));
      } else {
        rowText.appendChild(span({style:{fontSize:'10px',color:'#444'}},
          t.km+'km · '+(t.vert>=1000?(t.vert/1000).toFixed(1)+'k':t.vert)+'m · '+fmtHrTot(t.hrs)+' planned'));
      }

      // Second line: Sessions (+ Edit for current week)
      if(isDone){
        const actionRow=div({style:{display:'flex',gap:'6px',marginTop:'4px'}});
        actionRow.appendChild(btn({style:{padding:'2px 8px',borderRadius:'4px',fontSize:'9px',
          background:'var(--bg-input)',border:'1px solid var(--border)',color:'var(--text-mute)',cursor:'pointer'},
          onclick:e=>{e.stopPropagation();EDIT_WEEK=wn;ACTIVE_TAB='plan';BLOCK_EDITING=null;EXPANDED_DAY=null;EDITING_DAY=null;render();}},'Sessions ->'));
        if(isCur){
          actionRow.appendChild(btn({style:{padding:'2px 8px',borderRadius:'4px',fontSize:'9px',
            background:'var(--bg-input)',border:'1px solid var(--border)',color:'var(--text-mute)',cursor:'pointer'},
            onclick:e=>{e.stopPropagation();BLOCK_EDITING=isExpanded?null:wIdx;render();}},'Edit targets'));
        }
        rowText.appendChild(actionRow);
      }

      rowBtn.appendChild(rowText);

      // Right side chevron -- for done weeks only (future weeks use full row tap)
      if(isDone){
        rowBtn.appendChild(btn({style:{padding:'4px 6px',borderRadius:'4px',fontSize:'11px',
          background:'transparent',border:'none',color:'#333',flexShrink:'0',cursor:'pointer'},
          onclick:e=>{e.stopPropagation();BLOCK_EDITING=isExpanded?null:wIdx;render();}},isExpanded?'▲':'▼'));
      } else {
        rowBtn.appendChild(span({style:{fontSize:'11px',color:'#333',flexShrink:'0'}},isExpanded?'▲':'▼'));
      }

      // Wrapper for row + panels -- rounded bottom depends on whether expanded
      const rowWrap=div({style:{marginBottom:'5px'}});
      rowWrap.style.borderRadius='8px';
      rowBtn.style.borderRadius=isExpanded?'8px 8px 0 0':'8px';
      rowWrap.appendChild(rowBtn);

      // Expanded content
      if(isExpanded){
        if(isDone){
          // Past/current expanded: progress bars (current week also gets edit form if triggered)
          const barsDiv=div({style:{padding:'10px 12px 12px',background:'var(--bg-card)',
            border:'1px solid var(--border)',borderTop:'none',borderRadius:'0 0 8px 8px'}});

          if(!hasActuals){
            barsDiv.appendChild(span({style:{fontSize:'10px',color:'var(--text-mute)'}},'No sessions logged this week yet.'));
          } else {
            [['KM',actuals.km,t.km,'#60a5fa'],
             ['VERT',actuals.vert,t.vert,'#a29bfe'],
             ['HRS',actuals.hrs,t.hrs,'#ffd166']].forEach(([lb,act,tgt,col])=>{
              const row=div({style:{marginBottom:'6px'}});
              const over=act>tgt&&tgt>0;
              const pct=tgt>0?Math.min(100,Math.round(act/tgt*100)):0;
              const info=div({style:{display:'flex',justifyContent:'space-between',marginBottom:'2px'}});
              info.appendChild(span({style:{fontSize:'8px',color:'var(--text-mute)',letterSpacing:'0.1em'}},lb));
              const actF=lb==='HRS'?fmtHrTot(act):lb==='VERT'&&act>=1000?(act/1000).toFixed(1)+'k':Math.round(act);
              const tgtF=lb==='HRS'?fmtHrTot(t.hrs):lb==='VERT'&&t.vert>=1000?(t.vert/1000).toFixed(1)+'k':t[lb.toLowerCase()]||tgt;
              info.appendChild(span({style:{fontSize:'8px',color:over?'#ff6b6b':'var(--text-mute)'}},
                actF+' / '+tgtF+(lb==='KM'?'km':lb==='VERT'?'m':'')+(over?' ↑':pct===100?' ✓':' '+pct+'%')));
              row.appendChild(info); row.appendChild(pbar(act,tgt||1,col));
              barsDiv.appendChild(row);
            });
          }
          rowWrap.appendChild(barsDiv);

          // Current week: also show target edit form below bars
          if(isCur){
            const editPanel=div({style:{padding:'12px',background:'var(--bg-elev)',
              border:'1px solid '+tc2+'30',borderTop:'none',borderRadius:'0 0 8px 8px',
              marginTop:'-8px',paddingTop:'16px'}});
            editPanel.appendChild(div({style:{fontSize:'9px',color:'var(--text-mute)',letterSpacing:'0.1em',marginBottom:'10px'}},'ADJUST TARGETS'));
            let form={...TARGETS[wIdx]};
            const ng=div({class:'grid3',style:{marginBottom:'10px'}});
            [['Target km',form.km,'km',v=>form.km=parseFloat(v)||0],
             ['Target vert',form.vert,'m',v=>form.vert=parseFloat(v)||0],
             ['Target hrs',form.hrs,'hr',v=>form.hrs=parseFloat(v)||0]
            ].forEach(([lb,val,unit,cb])=>ng.appendChild(numInp(lb,val,cb,unit)));
            editPanel.appendChild(ng);
            const ebtns=div({style:{display:'flex',gap:'8px'}});
            ebtns.appendChild(btn({class:'btn btn-ok',style:{padding:'8px 14px'},
              onclick:()=>{TARGETS[wIdx]={...TARGETS[wIdx],...form};S.set(SK.targets,TARGETS);BLOCK_EDITING=null;render();}},'Save'));
            ebtns.appendChild(btn({class:'btn-sm btn-ghost',onclick:()=>{BLOCK_EDITING=null;render();}},'Cancel'));
            editPanel.appendChild(ebtns);
            rowWrap.appendChild(editPanel);
          }

        } else {
          // Future: edit panel
          const panel=div({style:{padding:'14px',background:'var(--bg-elev)',
            border:'1px solid '+tc2+'30',borderTop:'none',borderRadius:'0 0 8px 8px'}});
          const typeContainer=div({style:{marginBottom:'12px'}});
          typeContainer.appendChild(lbl('Week type'));
          const typeBtnsDiv=div({style:{display:'flex',gap:'6px',flexWrap:'wrap'}});
          function renderWTBtns(){
            typeBtnsDiv.innerHTML='';
            WEEK_TYPES.forEach(wt=>{
              const wtc=WTC[wt], isA=TARGETS[wIdx].type===wt;
              const b=btn({style:{padding:'5px 10px',borderRadius:'4px',fontSize:'10px',
                background:isA?wtc+'30':'var(--bg-input)',border:'1px solid '+(isA?wtc:'var(--border)'),
                color:isA?wtc:'var(--text-mute)'},
                onclick:()=>{TARGETS[wIdx]={...TARGETS[wIdx],type:wt};S.set(SK.targets,TARGETS);renderWTBtns();}},wt);
              typeBtnsDiv.appendChild(b);
            });
          }
          renderWTBtns();
          typeContainer.appendChild(typeBtnsDiv);
          panel.appendChild(typeContainer);

          let form={km:TARGETS[wIdx].km, vert:TARGETS[wIdx].vert, hrs:TARGETS[wIdx].hrs};
          const ng=div({class:'grid3',style:{marginBottom:'12px'}});
          [['Target km',form.km,'km',v=>form.km=parseFloat(v)||0],
           ['Target vert',form.vert,'m',v=>form.vert=parseFloat(v)||0],
           ['Target hrs',form.hrs,'hr',v=>form.hrs=parseFloat(v)||0]
          ].forEach(([lb,val,unit,cb])=>ng.appendChild(numInp(lb,val,cb,unit)));
          panel.appendChild(ng);

          const btnsRow=div({style:{display:'flex',gap:'8px'}});
          btnsRow.appendChild(btn({style:{padding:'8px 12px',borderRadius:'6px',fontSize:'10px',
            background:'var(--bg-input)',border:'1px solid var(--border)',color:'var(--text-mute)'},
            onclick:()=>{EDIT_WEEK=wn;ACTIVE_TAB='plan';BLOCK_EDITING=null;render();}},'View sessions'));
          btnsRow.appendChild(btn({class:'btn btn-ok',style:{padding:'9px 16px'},
            // type is already on TARGETS[wIdx] from button tap -- only merge km/vert/hrs from form
            onclick:()=>{TARGETS[wIdx]={...TARGETS[wIdx],km:form.km,vert:form.vert,hrs:form.hrs};S.set(SK.targets,TARGETS);BLOCK_EDITING=null;render();}},'Save'));
          btnsRow.appendChild(btn({class:'btn-sm btn-ghost',
            onclick:()=>{BLOCK_EDITING=null;render();}},'Cancel'));
          panel.appendChild(btnsRow);
          rowWrap.appendChild(panel);
        }
      }

      wrap.appendChild(rowWrap);
    });
  });

  // Block totals footer
  const totals=TARGETS.reduce((acc,t)=>({km:acc.km+t.km,vert:acc.vert+t.vert,hrs:acc.hrs+t.hrs}),{km:0,vert:0,hrs:0});
  const footer=div({style:{marginTop:'16px',padding:'12px 14px',background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'8px'}});
  footer.appendChild(div({class:'section-title',style:{marginBottom:'8px'}},'Block totals (planned)'));
  const totRow=div({style:{display:'flex',gap:'0'}});
  [[totals.km+'km','#60a5fa','TOTAL KM'],[( totals.vert/1000).toFixed(0)+'k','#a29bfe','VERT (000m)'],[fmtHrTot(totals.hrs),'#ffd166','HOURS']].forEach(([val,col,label])=>{

  });
  footer.appendChild(totRow);
  wrap.appendChild(footer);
  return wrap;
}

function renderPlan(){

  const week=plan[wIdx];
  const target=TARGETS[wIdx];
  const wrap=div({});

  const weekSel=div({style:{display:'flex',gap:'5px',marginBottom:'14px',flexWrap:'wrap'}});
  plan.forEach((_,i)=>{
    const wn=i+1, active=wn===EDIT_WEEK, isCur=wn===curWeek();
    const t=TARGETS[i]; const pc=WTC[t?.type]||'#555';
    const b=btn({class:'week-btn'+(active?' active':''),style:{
      background:active?pc+'22':'var(--bg-input)',
      border:'1px solid '+(active?pc:isCur?'var(--border-btn)':'var(--border)'),
      color:active?pc:isCur?'var(--text-mute)':'var(--text-dim)',

  // Actuals

    const t=getDayTotals(wIdx,dIdx);
    acc.km+=t.km; acc.vert+=t.vert; acc.hrs+=t.hrs;
    if(isDayDone(wIdx,dIdx)) acc.done++;
    return acc;
  },{km:0,vert:0,hrs:0,done:0});

  // Week header card
  const tc_w=WTC[target?.type]||'#555';
  const hdrCard=div({style:{marginBottom:'14px',padding:'12px 14px',borderRadius:'8px',background:'#0d1020',border:'1px solid #1c2040'}});
  const hdrTop=div({style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}});
  const hdrLeft=div({});
  const hdrBadges=div({class:'flex',style:{marginBottom:'4px'}});
